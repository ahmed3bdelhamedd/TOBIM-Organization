<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBIM — الداشبورد العام</title>
    <link rel="icon" type="image/jpeg" href="TobimLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style> body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex flex-col">

    <header class="bg-[#0f172a] border-b border-gray-800 h-20 flex items-center px-6 justify-between sticky top-0 z-40">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <img src="TobimLogo.jpg" onerror="this.src='https://via.placeholder.com/40'" class="w-10 h-10 rounded-xl object-cover border border-gray-700" alt="Logo">
                <span class="text-xl font-black text-white">TO BIM</span>
            </div>
            <nav class="hidden md:flex items-center gap-2 text-sm font-semibold">
                <a href="dashboard.html" class="bg-blue-600 text-white px-4 py-2 rounded-xl transition shadow-lg shadow-blue-600/20">الماليات</a>
                <a href="subscriptions.html" class="text-gray-400 hover:text-white px-4 py-2 rounded-xl transition">الاشتراكات</a>
            </nav>
        </div>
        <button onclick="localStorage.clear(); location.href='login.html';" class="bg-red-500/10 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl text-sm font-bold hover:bg-red-500/20 transition">خروج</button>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8 space-y-6">
        <div class="flex items-center gap-2 overflow-x-auto pb-2 border-b border-gray-800 mb-6">
            <a href="dashboard.html" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap"><i class="fa-solid fa-chart-pie ml-2"></i>الداشبورد العام</a>
            <a href="payroll.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-5 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition"><i class="fa-solid fa-users ml-2"></i>إدارة الرواتب</a>
            <a href="marketing.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-5 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition"><i class="fa-solid fa-bullhorn ml-2"></i>التسويق</a>
            <a href="expenses.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-5 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition"><i class="fa-solid fa-receipt ml-2"></i>المصروفات العامة</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-[#111827] p-6 rounded-3xl border border-gray-800 relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-1 h-full bg-emerald-500"></div>
                <h3 class="font-bold text-lg text-white mb-4">إجمالي الإيرادات</h3>
                <p class="text-3xl font-black text-white mb-2">145,200 <span class="text-sm text-gray-500">ج.م</span></p>
                <p class="text-sm text-emerald-400"><i class="fa-solid fa-arrow-trend-up ml-1"></i> +12% هذا الشهر</p>
            </div>
            <div class="bg-[#111827] p-6 rounded-3xl border border-gray-800 relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-1 h-full bg-rose-500"></div>
                <h3 class="font-bold text-lg text-white mb-4">إجمالي المصروفات</h3>
                <p class="text-3xl font-black text-white mb-2">32,450 <span class="text-sm text-gray-500">ج.م</span></p>
                <p class="text-sm text-rose-400"><i class="fa-solid fa-arrow-trend-up ml-1"></i> +5% هذا الشهر</p>
            </div>
            <div class="bg-[#111827] p-6 rounded-3xl border border-gray-800 relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-1 h-full bg-blue-500"></div>
                <h3 class="font-bold text-lg text-white mb-4">صافي الربح</h3>
                <p class="text-3xl font-black text-white mb-2">112,750 <span class="text-sm text-gray-500">ج.م</span></p>
                <p class="text-sm text-gray-400">بعد خصم الرواتب والمصروفات</p>
            </div>
        </div>

        <div class="bg-[#111827] p-6 rounded-3xl border border-gray-800">
            <h3 class="font-bold text-lg text-white mb-6">معدل النمو (آخر 6 أشهر)</h3>
            <div class="relative h-72 w-full">
                <canvas id="growthChart"></canvas>
            </div>
        </div>
    </main>

    <script>
        const ctx = document.getElementById('growthChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر'],
                datasets: [
                    { label: 'الإيرادات', data: [50000, 70000, 65000, 90000, 110000, 145000], backgroundColor: '#10b981', borderRadius: 6 },
                    { label: 'المصروفات', data: [20000, 25000, 22000, 28000, 30000, 32000], backgroundColor: '#f43f5e', borderRadius: 6 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#9ca3af', font: { family: 'Cairo' } } } },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#9ca3af', font: { family: 'Cairo' } } },
                    y: { grid: { color: '#1f2937' }, ticks: { color: '#9ca3af', font: { family: 'Cairo' } } }
                }
            }
        });
    </script>
</body>
</html>
