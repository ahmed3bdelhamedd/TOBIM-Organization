<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBIM — الداشبورد المالي الشامل</title>
    <link rel="icon" type="image/jpeg" href="TobimLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .clickable-card { transition: all 0.3s ease; }
        .clickable-card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col">

    <!-- حماية صفحة الماليات -->
    <script>
        const userEmailCheck = localStorage.getItem('tobim_user_email');
        if (userEmailCheck !== 'info@ahmedabdelhamed.com') {
            alert("عذراً، هذه الصفحة مخصصة لمدير النظام (الإدارة) فقط.");
            window.location.href = 'subscriptions.html';
        }
    </script>

    <!-- الهيدر الموحد -->
    <!-- (يمكنك إدراج كود الهيدر المشترك هنا) -->

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8 space-y-8 relative z-10">
        <!-- شريط التنقل الفرعي -->
        <div class="flex items-center gap-3 overflow-x-auto pb-4 border-b border-gray-800/50">
            <a href="dashboard.html" class="bg-gradient-to-r from-blue-600 to-blue-700 text-white px-6 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap shadow-lg"><i class="fa-solid fa-chart-pie ml-2"></i>الداشبورد العام</a>
            <a href="statements.html" class="bg-[#111827] text-gray-400 hover:text-white border border-gray-800 px-6 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition"><i class="fa-solid fa-file-invoice-dollar ml-2"></i>كشف الحسابات</a>
            <a href="payroll.html" class="bg-[#111827] text-gray-400 hover:text-white border border-gray-800 px-6 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition"><i class="fa-solid fa-users ml-2"></i>إدارة الرواتب</a>
            <a href="marketing.html" class="bg-[#111827] text-gray-400 hover:text-white border border-gray-800 px-6 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition"><i class="fa-solid fa-bullhorn ml-2"></i>التسويق</a>
            <a href="expenses.html" class="bg-[#111827] text-gray-400 hover:text-white border border-gray-800 px-6 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition"><id class="fa-solid fa-receipt ml-2"></i>المصروفات العامة</a>
        </div>

        <!-- بطاقات الملخص المالي -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
            <a href="subscriptions.html" class="clickable-card block bg-gradient-to-br from-[#111827] to-[#0f172a] p-5 rounded-3xl border border-emerald-500/30">
                <h3 class="font-bold text-gray-400 mb-2 text-sm">الإيرادات المحصلة</h3>
                <p class="text-2xl font-black text-emerald-400">223,000 <span class="text-xs text-emerald-500">ج.م</span></p>
            </a>
            <a href="payroll.html" class="clickable-card block bg-gradient-to-br from-[#111827] to-[#0f172a] p-5 rounded-3xl border border-indigo-500/30">
                <h3 class="font-bold text-gray-400 mb-2 text-sm">إجمالي الرواتب</h3>
                <p class="text-2xl font-black text-indigo-400">98,000 <span class="text-xs text-indigo-500">ج.م</span></p>
            </a>
            <a href="marketing.html" class="clickable-card block bg-gradient-to-br from-[#111827] to-[#0f172a] p-5 rounded-3xl border border-fuchsia-500/30">
                <h3 class="font-bold text-gray-400 mb-2 text-sm">الحملات الإعلانية</h3>
                <p class="text-2xl font-black text-fuchsia-400">25,000 <span class="text-xs text-fuchsia-500">ج.م</span></p>
            </a>
            <a href="expenses.html" class="clickable-card block bg-gradient-to-br from-[#111827] to-[#0f172a] p-5 rounded-3xl border border-rose-500/30">
                <h3 class="font-bold text-gray-400 mb-2 text-sm">المصروفات العامة</h3>
                <p class="text-2xl font-black text-rose-400">20,000 <span class="text-xs text-rose-500">ج.م</span></p>
            </a>
            <a href="statements.html" class="clickable-card block bg-gradient-to-br from-blue-900/40 to-[#111827] p-5 rounded-3xl border border-blue-500/50">
                <h3 class="font-bold text-blue-200 mb-2 text-sm">صافي الربح</h3>
                <p class="text-2xl font-black text-white">80,000 <span class="text-xs text-blue-300">ج.م</span></p>
            </a>
        </div>
    </main>
</body>
</html>
