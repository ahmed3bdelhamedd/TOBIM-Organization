<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBIM — لوحة التحكم</title>
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="TobimLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Cairo', sans-serif; }
        [x-cloak] { display: none !important; }
        .glass-card { background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex flex-col" x-data="systemDashboard()">

    <!-- تحقق من تسجيل الدخول -->
    <script>
        if(!localStorage.getItem('tobim_role')) {
            window.location.href = 'login.html';
        }
    </script>

    <!-- Navbar -->
    <header class="bg-[#0f172a] border-b border-gray-800 h-20 flex items-center px-6 justify-between sticky top-0 z-40 shadow-sm">
        <div class="flex items-center gap-4">
            <img src="TobimLogo.jpg" class="w-10 h-10 rounded-xl object-cover border border-gray-700" alt="Logo">
            <span class="text-xl font-black text-white" x-text="isAdmin ? 'TO BIM — لوحة المدير الشاملة' : 'TO BIM — لوحة الموظف'"></span>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-xs bg-blue-500/10 text-blue-400 border border-blue-500/30 px-3 py-1.5 rounded-xl font-bold" x-text="isAdmin ? 'صلاحية: مدير (Admin)' : 'صلاحية: موظف (Employee)'"></span>
            <button @click="logout()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl text-sm font-bold transition">
                خروج
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">
        
        <!-- DASHBOARD STATISTICS (تظهر للمدير فقط ولا تظهر للموظف) -->
        <template x-if="isAdmin">
            <div class="space-y-6">
                <div class="bg-gradient-to-r from-blue-900/40 to-indigo-900/40 p-6 rounded-3xl border border-blue-500/30 flex items-center justify-between">
                    <div>
                        <h2 class="text-xl font-black text-white mb-1">مرحباً بك يا مدير النظام</h2>
                        <p class="text-xs text-gray-300">هنا لوحة التحكم الإحصائية الكاملة التي تظهر لصلاحيات المدير فقط.</p>
                    </div>
                    <span class="bg-blue-600 text-white text-xs font-bold px-4 py-2 rounded-xl shadow">مدير معتمد</span>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="glass-card p-5 rounded-2xl border-t-2 border-blue-500 text-center">
                        <span class="text-3xl font-black text-white">17</span>
                        <p class="text-xs text-gray-400 mt-1 font-semibold">إجمالي الاشتراكات</p>
                    </div>
                    <div class="glass-card p-5 rounded-2xl border-t-2 border-amber-500 text-center">
                        <span class="text-3xl font-black text-amber-400">11</span>
                        <p class="text-xs text-gray-400 mt-1 font-semibold">حالات Rest (متبقي)</p>
                    </div>
                    <div class="glass-card p-5 rounded-2xl border-t-2 border-emerald-500 text-center">
                        <span class="text-3xl font-black text-emerald-400">5</span>
                        <p class="text-xs text-gray-400 mt-1 font-semibold">حالات Full Pay</p>
                    </div>
                    <div class="glass-card p-5 rounded-2xl border-t-2 border-purple-500 text-center">
                        <span class="text-3xl font-black text-purple-400">1</span>
                        <p class="text-xs text-gray-400 mt-1 font-semibold">حالات Hold</p>
                    </div>
                </div>
            </div>
        </template>

        <!-- EMPLOYEE VIEW (تظهر للموظف أو المدير معاً) -->
        <div class="glass-card p-6 rounded-3xl border border-gray-800 shadow-xl">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-lg font-black text-white">سجل العمليات والاشتراكات المتاحة</h2>
                <a href="new-sub.html" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow">إضافة اشتراك جديد</a>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead class="bg-[#131b2e] text-gray-400 text-xs uppercase border-b border-gray-800">
                        <tr>
                            <th class="p-4">#</th>
                            <th class="p-4">الاسم</th>
                            <th class="p-4">الموبايل</th>
                            <th class="p-4">القسم / الراوند</th>
                            <th class="p-4">سعر البيع</th>
                            <th class="p-4">المدفوع</th>
                            <th class="p-4">المتبقي</th>
                            <th class="p-4">الحالة</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-800">
                        <tr class="hover:bg-blue-600/10 transition">
                            <td class="p-4 font-bold text-gray-400">201135</td>
                            <td class="p-4 font-bold text-white">SHADY MOSTAFA ABDELATEF ELSAYED</td>
                            <td class="p-4 text-gray-300 font-mono">0111111111</td>
                            <td class="p-4 text-blue-400">إنشائي / Round 27</td>
                            <td class="p-4 font-mono">12,000 EGP</td>
                            <td class="p-4 font-mono text-emerald-400">9,500 EGP</td>
                            <td class="p-4 font-mono text-amber-400">2,500 EGP</td>
                            <td class="p-4"><span class="bg-amber-500/20 text-amber-400 px-3 py-1 rounded-full text-xs font-bold border border-amber-500/30">Rest</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        function systemDashboard() {
            return {
                isAdmin: localStorage.getItem('tobim_role') === 'admin',
                logout() {
                    localStorage.removeItem('tobim_role');
                    window.location.href = 'login.html';
                }
            }
        }
    </script>
</body>
</html>
