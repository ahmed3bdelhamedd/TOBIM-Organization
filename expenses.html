<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBIM — المصروفات العامة</title>
    <link rel="icon" type="image/jpeg" href="TobimLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen relative">
    
    <header class="bg-[#0f172a] border-b border-gray-800 h-20 flex items-center px-6 justify-between sticky top-0 z-40">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <img src="TobimLogo.jpg" onerror="this.src='https://via.placeholder.com/40'" class="w-10 h-10 rounded-xl object-cover border border-gray-700" alt="Logo">
                <span class="text-xl font-black text-white">TO BIM</span>
            </div>
            <nav class="hidden md:flex items-center gap-2 text-sm font-semibold">
                <a href="dashboard.html" class="bg-blue-600 text-white px-4 py-2 rounded-xl transition shadow-lg shadow-blue-600/20">الماليات</a>
                <a href="subscriptions.html" class="text-gray-400 hover:text-white px-4 py-2 rounded-xl transition">الاشتراكات</a>
            </nav>
        </div>
        <button onclick="localStorage.clear(); location.href='login.html';" class="bg-red-500/10 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl text-sm font-bold hover:bg-red-500/20 transition">خروج</button>
    </header>
    
    <main class="max-w-7xl mx-auto p-4 md:p-8">
        
        <div class="flex items-center gap-2 overflow-x-auto pb-2 border-b border-gray-800 mb-6">
            <a href="dashboard.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-5 py-2.5 rounded-xl text-sm font-bold transition">الداشبورد العام</a>
            <a href="payroll.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-5 py-2.5 rounded-xl text-sm font-bold transition">إدارة الرواتب</a>
            <a href="marketing.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-5 py-2.5 rounded-xl text-sm font-bold transition">التسويق</a>
            <a href="expenses.html" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold">المصروفات العامة</a>
        </div>

        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black text-white">سجل المصروفات العامة</h2>
            <button onclick="openModal()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition">
                <i class="fa-solid fa-plus ml-1"></i> إضافة مصروف
            </button>
        </div>

        <div class="bg-[#111827] p-5 rounded-3xl border border-gray-800 flex flex-wrap items-end gap-4 mb-6">
            <div>
                <label class="block text-sm text-gray-400 mb-2">الشهر</label>
                <select class="bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none w-32"><option value="الكل">الكل</option><option value="11" selected>نوفمبر</option></select>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">السنة</label>
                <select class="bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none w-32"><option value="2026" selected>2026</option></select>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">تصنيف المصروف</label>
                <select class="bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none w-40">
                    <option value="الكل" selected>جميع التصنيفات</option>
                    <option value="إيجارات">إيجارات</option>
                    <option value="ضيافة">ضيافة</option>
                    <option value="كانتين">كانتين</option>
                    <option value="مستلزمات صحية">مستلزمات صحية</option>
                    <option value="أجهزة">أجهزة</option>
                </select>
            </div>
            <button class="bg-gray-800 hover:bg-gray-700 text-white px-6 py-2.5 rounded-xl text-sm font-bold transition flex-1 md:flex-none">استخراج التقرير</button>
        </div>

        <div class="bg-[#111827] rounded-3xl border border-gray-800 overflow-hidden">
            <table class="w-full text-right min-w-[700px]">
                <thead class="bg-[#0f172a] text-gray-400 text-sm">
                    <tr><th class="p-4">البند</th><th class="p-4">التصنيف</th><th class="p-4">التاريخ</th><th class="p-4">المبلغ</th><th class="p-4">الحالة</th></tr>
                </thead>
                <tbody id="expenses-table-body" class="divide-y divide-gray-800">
                    <tr class="hover:bg-gray-800/30">
                        <td class="p-4 font-bold">إيجار المقر (نوفمبر)</td>
                        <td class="p-4 text-sm text-gray-400">إيجارات</td>
                        <td class="p-4 text-sm">01 نوفمبر 2026</td>
                        <td class="p-4 font-bold text-white">10,000 ج.م</td>
                        <td class="p-4"><span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded text-xs font-bold">مدفوع</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="expenseModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-[#111827] border border-gray-800 p-6 rounded-3xl w-full max-w-md">
            <h3 class="text-xl font-bold text-white mb-6">إضافة مصروف جديد</h3>
            <div class="space-y-4">
                <div><label class="block text-sm text-gray-400 mb-1">اسم البند</label><input type="text" id="expName" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2"></div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">التصنيف</label>
                    <select id="expCategory" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2">
                        <option value="إيجارات">إيجارات</option>
                        <option value="ضيافة">ضيافة</option>
                        <option value="كانتين">كانتين</option>
                        <option value="مستلزمات صحية">مستلزمات صحية</option>
                        <option value="أجهزة">أجهزة ومعدات</option>
                        <option value="تقنية معلومات">تقنية معلومات</option>
                    </select>
                </div>
                <div><label class="block text-sm text-gray-400 mb-1">تاريخ المصروف</label><input type="date" id="expDate" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2" style="color-scheme: dark;"></div>
                <div><label class="block text-sm text-gray-400 mb-1">المبلغ (ج.م)</label><input type="number" id="expAmount" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2"></div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">الحالة</label>
                    <select id="expStatus" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2">
                        <option value="مدفوع">مدفوع</option><option value="مستحق">مستحق</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="addExpense()" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white px-4 py-2.5 rounded-xl font-bold transition">حفظ المصروف</button>
                <button onclick="closeModal()" class="flex-1 bg-[#0b0f19] hover:bg-gray-800 border border-gray-700 text-white px-4 py-2.5 rounded-xl font-bold transition">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('expenseModal');
        const tableBody = document.getElementById('expenses-table-body');
        document.getElementById('expDate').valueAsDate = new Date();

        function openModal() { modal.classList.remove('hidden'); }
        function closeModal() {
            modal.classList.add('hidden');
            document.getElementById('expName').value = '';
            document.getElementById('expAmount').value = '';
            document.getElementById('expDate').valueAsDate = new Date();
        }

        function addExpense() {
            const name = document.getElementById('expName').value;
            const category = document.getElementById('expCategory').value;
            const amount = document.getElementById('expAmount').value;
            const status = document.getElementById('expStatus').value;
            const rawDate = document.getElementById('expDate').value;

            if (!name || !amount) return alert("يرجى إدخال اسم البند والمبلغ!");

            const formattedDate = new Date(rawDate).toLocaleDateString('ar-EG', { day: '2-digit', month: 'long', year: 'numeric' });
            const badge = status === 'مدفوع' ? `<span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded text-xs font-bold">مدفوع</span>` : `<span class="bg-amber-500/20 text-amber-400 px-2 py-1 rounded text-xs font-bold">مستحق</span>`;

            const newRow = document.createElement('tr');
            newRow.className = "hover:bg-gray-800/30";
            newRow.innerHTML = `<td class="p-4 font-bold">${name}</td><td class="p-4 text-sm text-gray-400">${category}</td><td class="p-4 text-sm">${formattedDate}</td><td class="p-4 font-bold text-white">${parseFloat(amount).toLocaleString()} ج.م</td><td class="p-4">${badge}</td>`;
            
            tableBody.insertBefore(newRow, tableBody.firstChild);
            closeModal();
        }
    </script>
</body>
</html>
