<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBIM — المصروفات العامة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen relative">
    
    <!-- الهيدر الرئيسي -->
    <header class="bg-[#0f172a] border-b border-gray-800 h-20 flex items-center px-6 justify-between sticky top-0 z-40">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <img src="TobimLogo.jpg" onerror="this.src='https://via.placeholder.com/40'" class="w-10 h-10 rounded-xl object-cover border border-gray-700" alt="Logo">
                <span class="text-xl font-black text-white">TO BIM</span>
            </div>
            <nav class="hidden md:flex items-center gap-2 text-sm font-semibold">
                <a href="dashboard.html" class="bg-blue-600 text-white px-4 py-2 rounded-xl transition shadow-lg shadow-blue-600/20">الماليات</a>
                <a href="subscriptions.html" class="text-gray-400 hover:text-white px-4 py-2 rounded-xl transition">الاشتراكات</a>
            </nav>
        </div>
        <button onclick="localStorage.clear(); location.href='login.html';" class="bg-red-500/10 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl text-sm font-bold hover:bg-red-500/20 transition">خروج</button>
    </header>
    
    <main class="max-w-7xl mx-auto p-4 md:p-8">
        
        <!-- شريط التنقل (Sub-header) -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 border-b border-gray-800 mb-6">
            <a href="dashboard.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-5 py-2.5 rounded-xl text-sm font-bold transition">الداشبورد العام</a>
            <a href="payroll.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-5 py-2.5 rounded-xl text-sm font-bold transition">إدارة الرواتب</a>
            <a href="marketing.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-5 py-2.5 rounded-xl text-sm font-bold transition">التسويق</a>
            <a href="expenses.html" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold">المصروفات العامة</a>
        </div>

        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black text-white">سجل المصروفات العامة</h2>
            <!-- تم إضافة دالة الفتح هنا -->
            <button onclick="openModal()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition"><i class="fa-solid fa-plus ml-1"></i> إضافة مصروف</button>
        </div>

        <div class="bg-[#111827] rounded-3xl border border-gray-800 overflow-hidden">
            <table class="w-full text-right">
                <thead class="bg-[#0f172a] text-gray-400 text-sm">
                    <tr>
                        <th class="p-4">البند</th>
                        <th class="p-4">التصنيف</th>
                        <th class="p-4">التاريخ</th>
                        <th class="p-4">المبلغ</th>
                        <th class="p-4">الحالة</th>
                    </tr>
                </thead>
                <tbody id="expenses-table-body" class="divide-y divide-gray-800">
                    <tr class="hover:bg-gray-800/30">
                        <td class="p-4 font-bold">إيجار المقر (نوفمبر)</td>
                        <td class="p-4 text-sm text-gray-400">إيجارات</td>
                        <td class="p-4 text-sm">01 نوفمبر 2026</td>
                        <td class="p-4 font-bold text-white">15,000 ج.م</td>
                        <td class="p-4"><span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded text-xs font-bold">مدفوع</span></td>
                    </tr>
                    <tr class="hover:bg-gray-800/30">
                        <td class="p-4 font-bold">تجديد استضافة وسيرفرات</td>
                        <td class="p-4 text-sm text-gray-400">تقنية معلومات</td>
                        <td class="p-4 text-sm">05 نوفمبر 2026</td>
                        <td class="p-4 font-bold text-white">3,200 ج.م</td>
                        <td class="p-4"><span class="bg-amber-500/20 text-amber-400 px-2 py-1 rounded text-xs font-bold">مستحق</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- النافذة المنبثقة (Modal) لإضافة المصروف -->
    <div id="expenseModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-[#111827] border border-gray-800 p-6 rounded-3xl w-full max-w-md">
            <h3 class="text-xl font-bold text-white mb-6">إضافة مصروف جديد</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">اسم البند</label>
                    <input type="text" id="expName" placeholder="مثال: فاتورة كهرباء" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none focus:border-rose-500">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-1">التصنيف</label>
                    <input type="text" id="expCategory" placeholder="مثال: مرافق" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none focus:border-rose-500">
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-1">المبلغ (ج.م)</label>
                    <input type="number" id="expAmount" placeholder="0" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none focus:border-rose-500">
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-1">الحالة</label>
                    <select id="expStatus" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none focus:border-rose-500">
                        <option value="مدفوع">مدفوع</option>
                        <option value="مستحق">مستحق</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button onclick="addExpense()" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white px-4 py-2.5 rounded-xl font-bold transition">إضافة</button>
                <button onclick="closeModal()" class="flex-1 bg-[#0b0f19] hover:bg-gray-800 border border-gray-700 text-white px-4 py-2.5 rounded-xl font-bold transition">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- سكريبت تشغيل النافذة وإضافة البيانات للجدول -->
    <script>
        const modal = document.getElementById('expenseModal');
        const tableBody = document.getElementById('expenses-table-body');

        function openModal() {
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
            // مسح الخانات بعد الإغلاق
            document.getElementById('expName').value = '';
            document.getElementById('expCategory').value = '';
            document.getElementById('expAmount').value = '';
        }

        function addExpense() {
            const name = document.getElementById('expName').value;
            const category = document.getElementById('expCategory').value;
            const amount = document.getElementById('expAmount').value;
            const status = document.getElementById('expStatus').value;

            if (!name || !amount) {
                alert("يرجى إدخال اسم البند والمبلغ على الأقل!");
                return;
            }

            // الحصول على تاريخ اليوم
            const today = new Date();
            const dateOptions = { day: '2-digit', month: 'long', year: 'numeric' };
            const formattedDate = today.toLocaleDateString('ar-EG', dateOptions);

            // تحديد لون الحالة
            const statusBadge = status === 'مدفوع' 
                ? `<span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded text-xs font-bold">مدفوع</span>`
                : `<span class="bg-amber-500/20 text-amber-400 px-2 py-1 rounded text-xs font-bold">مستحق</span>`;

            // إنشاء سطر جديد في الجدول
            const newRow = document.createElement('tr');
            newRow.className = "hover:bg-gray-800/30";
            newRow.innerHTML = `
                <td class="p-4 font-bold">${name}</td>
                <td class="p-4 text-sm text-gray-400">${category}</td>
                <td class="p-4 text-sm">${formattedDate}</td>
                <td class="p-4 font-bold text-white">${parseFloat(amount).toLocaleString()} ج.م</td>
                <td class="p-4">${statusBadge}</td>
            `;

            // إضافة السطر لأول الجدول
            tableBody.insertBefore(newRow, tableBody.firstChild);

            // إغلاق النافذة
            closeModal();
        }
    </script>
</body>
</html>
