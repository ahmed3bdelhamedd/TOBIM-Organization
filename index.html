<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBIM — هندسة البناء ونمذجة معلومات البناء (BIM)</title>
    <link rel="icon" type="image/jpeg" href="TobimLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen">

    <!-- Navbar -->
    <header class="bg-[#0f172a]/90 backdrop-blur border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="TobimLogo.jpg" class="w-11 h-11 rounded-xl object-cover border border-gray-700 shadow" alt="Logo">
                <span class="text-2xl font-black text-blue-500 tracking-wider">TOBIM</span>
            </div>
            <a href="login.html" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-2.5 rounded-xl transition shadow-lg shadow-blue-600/30">تسجيل الدخول الإداري</a>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="relative bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 py-24 text-center px-6">
        <div class="max-w-4xl mx-auto space-y-6">
            <span class="bg-blue-500/20 text-blue-300 text-xs font-bold px-4 py-1.5 rounded-full border border-blue-400/30 inline-block">أكاديمية الهندسة والـ BIM الأولى</span>
            <h1 class="text-4xl sm:text-6xl font-black text-white leading-tight">احترف برمجيات البناء والهندسة المعمارية والإنشائية</h1>
            <p class="text-gray-300 text-lg max-w-2xl mx-auto leading-relaxed">نقدم دبلومات متخصصة في Revit, 3Ds Max, ACC, و Enscape بشهادات معتمدة وتطبيق عملي من قلب سوق العمل.</p>
            <div class="pt-4">
                <a href="login.html" class="inline-block bg-blue-600 hover:bg-blue-500 text-white font-extrabold px-8 py-4 rounded-2xl shadow-xl shadow-blue-600/30 transition">دخول لوحة التحكم</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-[#07090e] border-t border-gray-800 py-8 text-center text-xs text-gray-500">
        جميع الحقوق محفوظة © 2026 TOBIM Academy
    </footer>
</body>
</html>
