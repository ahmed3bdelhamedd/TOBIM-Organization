<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO BIM — تسجيل الدخول</title>
    <link rel="icon" type="image/jpeg" href="TobimLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-[#07090e] text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#111827] w-full max-w-md p-8 rounded-3xl shadow-2xl border border-gray-800 text-center relative overflow-hidden">
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-blue-600/20 rounded-full blur-3xl"></div>
        
        <img src="TobimLogo.jpg" alt="Logo" class="w-16 h-16 rounded-2xl mx-auto object-cover mb-4 border border-gray-700 shadow-md" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100&auto=format&fit=crop&q=80'">
        <h1 class="text-2xl font-black text-white mb-1">TO BIM</h1>
        <p class="text-xs text-gray-400 mb-8">لوحة التحكم الإدارية المركزية</p>

        <form action="subscriptions.html" method="GET" class="space-y-5 text-right">
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-2">الإيميل الإداري</label>
                <input type="email" required value="ahmed.tobim@gmail.com" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-2">كلمة المرور</label>
                <input type="password" required value="••••••••" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-blue-600/30">
                دخول للنظام
            </button>
        </form>
    </div>
</body>
</html>
