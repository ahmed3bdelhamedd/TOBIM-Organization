<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBIM — تسجيل الدخول</title>
    <link rel="icon" type="image/jpeg" href="TobimLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; }</style>
</head>
<body class="text-gray-100 min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-900/40 via-[#0b0f19] to-[#0b0f19]">

    <div class="bg-[#111827]/90 backdrop-blur-xl border border-gray-800 p-8 rounded-3xl w-full max-w-md shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <img src="TobimLogo.jpg" onerror="this.src='https://via.placeholder.com/60'" class="w-16 h-16 rounded-2xl object-cover mx-auto border border-gray-700 shadow-lg" alt="Logo">
            <h1 class="text-2xl font-black text-white">تسجيل الدخول إلى TO BIM</h1>
            <p class="text-sm text-gray-400">أدخل بيانات الحساب للمتابعة</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">البريد الإلكتروني (الإيميل)</label>
                <input type="email" id="email-input" required placeholder="name@tobim.com" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">كلمة المرور</label>
                <input type="password" id="password-input" required placeholder="••••••••" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white py-3 rounded-xl font-black transition shadow-lg shadow-blue-900/50">
                تسجيل الدخول
            </button>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value.trim();

            localStorage.setItem('tobim_user_email', email);

            // التحقق من بيانات الأدمن
            if (email === 'info@ahmedabdelhamed.com' && password === 'tobim@2023') {
                localStorage.setItem('tobim_role', 'admin');
                localStorage.setItem('tobim_user_name', 'أحمد عبد الحميد');
                window.location.href = 'dashboard.html';
            } else {
                localStorage.setItem('tobim_role', 'sales');
                localStorage.setItem('tobim_user_name', 'موظف مبيعات');
                window.location.href = 'subscriptions.html';
            }
        }
    </script>
</body>
</html>
