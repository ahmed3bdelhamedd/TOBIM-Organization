<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBIM — تسجيل الدخول</title>
    <link rel="icon" type="image/jpeg" href="TobimLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-[#07090e] text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-[#111827] w-full max-w-md p-8 rounded-3xl shadow-2xl border border-gray-800 text-center relative">
        <img src="TobimLogo.jpg" alt="Logo" class="w-16 h-16 rounded-2xl mx-auto object-cover mb-4 border border-gray-700 shadow">
        <h1 class="text-2xl font-black text-white mb-1">تسجيل الدخول للنظام</h1>
        <p class="text-xs text-gray-400 mb-6">اختر الصلاحية وأدخل بياناتك</p>

        <form onsubmit="handleLogin(event)" class="space-y-4 text-right">
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-2">نوع الحساب</label>
                <select id="role" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl px-4 py-3 text-sm text-white outline-none">
                    <option value="employee">موظف (Employee)</option>
                    <option value="admin">مدير النظام (Admin)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-2">اسم المستخدم أو الإيميل</label>
                <input type="text" id="username" required placeholder="name@tobim.com" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl px-4 py-3 text-sm text-white outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 mb-2">كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl px-4 py-3 text-sm text-white outline-none">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition shadow">
                دخول للنظام
            </button>
        </form>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            let role = document.getElementById('role').value;
            let pass = document.getElementById('password').value;
            
            if(role === 'admin' && pass !== 'tobim@2023') {
                alert('كلمة المرور غير صحيحة للمدير!');
                return;
            }
            localStorage.setItem('tobim_role', role);
            localStorage.setItem('tobim_logged', 'true');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
