<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBIM — اشتراك جديد</title>
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="TobimLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Cairo', sans-serif; }
        .glass-card { background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex flex-col">

    <!-- تحقق من تسجيل الدخول -->
    <script>
        if(!localStorage.getItem('tobim_role')) {
            window.location.href = 'login.html';
        }
    </script>

    <!-- Navbar -->
    <header class="bg-[#0f172a] border-b border-gray-800 h-20 flex items-center px-6 justify-between sticky top-0 z-40 shadow-sm">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <img src="TobimLogo.jpg" class="w-10 h-10 rounded-xl object-cover border border-gray-700" alt="Logo">
                <span class="text-xl font-black text-white">TO BIM — إضافة اشتراك</span>
            </div>
            <nav class="hidden md:flex items-center gap-2 text-sm font-semibold">
                <a href="dashboard.html" class="text-gray-400 hover:text-white px-4 py-2 rounded-xl transition">لوحة التحكم</a>
                <a href="new-sub.html" class="bg-blue-600 text-white px-4 py-2 rounded-xl transition">اشتراك جديد</a>
            </nav>
        </div>
        <button onclick="localStorage.removeItem('tobim_role'); location.href='login.html';" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl text-sm font-bold transition">
            خروج
        </button>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-6 space-y-6">
        <div class="glass-card p-6 sm:p-8 rounded-3xl border border-gray-800 shadow-xl">
            <h2 class="text-xl font-black text-white mb-6 flex items-center gap-3">
                <span class="w-3 h-3 bg-blue-500 rounded-full animate-ping"></span>
                تسجيل اشتراك جديد في النظام
            </h2>

            <form onsubmit="submitSubscription(event)" class="space-y-6">
                <!-- Dropdowns -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-2">القسم</label>
                        <select id="department" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl p-3 text-sm text-white outline-none">
                            <option>معماري</option>
                            <option>إنشائي</option>
                            <option>كورسات ودبلومات</option>
                            <option>منتجات</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-2">الراوند</label>
                        <select id="round" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl p-3 text-sm text-white outline-none">
                            <option>Round 27</option>
                            <option>Round 26</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-2">الحالة</label>
                        <select id="status" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl p-3 text-sm text-white outline-none">
                            <option value="Rest">تلقائي (Rest / Full Pay)</option>
                            <option value="Full Pay">Full Pay</option>
                            <option value="Hold">Hold</option>
                        </select>
                    </div>
                </div>

                <!-- Proof Upload -->
                <div class="border-2 border-dashed border-gray-700 hover:border-blue-500 transition bg-[#131b2e]/60 p-6 rounded-2xl text-center">
                    <p class="text-sm text-gray-200 font-bold mb-1">صورة التحويل والدفعات (حتى 4)</p>
                    <p class="text-xs text-gray-400 mb-3">ارفع صورة التحويل البنكي أو المحفظة.</p>
                    <input type="file" class="text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-blue-600 file:text-white cursor-pointer">
                </div>

                <!-- Subscriber Data -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-2">اسم المشترك (ثلاثي)</label>
                        <input type="text" id="fullName" required placeholder="الاسم ثلاثي" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl p-3 text-sm text-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-2">موبايل المشترك</label>
                        <input type="text" id="mobile" required placeholder="01111111111" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl p-3 text-sm text-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-2">الإيميل (اختياري)</label>
                        <input type="email" id="email" placeholder="email@domain.com" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl p-3 text-sm text-white outline-none">
                    </div>
                </div>

                <!-- Financial Details -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-2">سعر البيع المتفق عليه (EGP)</label>
                        <input type="number" id="totalPrice" required placeholder="12000" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl p-3 text-sm text-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-2">المبلغ المدفوع حالياً (EGP)</label>
                        <input type="number" id="paidAmount" required placeholder="9500" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl p-3 text-sm text-white outline-none">
                    </div>
                </div>

                <!-- Submit Buttons -->
                <div class="flex justify-end gap-4 border-t border-gray-800 pt-6">
                    <a href="dashboard.html" class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold px-6 py-3 rounded-xl transition text-sm flex items-center">إلغاء</a>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-8 py-3 rounded-xl transition shadow-lg shadow-blue-600/30 text-sm">حفظ الاشتراك</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        function submitSubscription(e) {
            e.preventDefault();
            alert('تم حفظ الاشتراك بنجاح في النظام!');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
