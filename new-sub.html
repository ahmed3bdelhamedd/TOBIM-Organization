<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBIM — اشتراك جديد</title>
    <link rel="icon" type="image/jpeg" href="TobimLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex flex-col">
    <script>if(!localStorage.getItem('tobim_logged')) window.location.href = 'login.html';</script>

    <header class="bg-[#0f172a] border-b border-gray-800 h-20 flex items-center px-6 justify-between sticky top-0 z-40">
        <div class="flex items-center gap-6">
            <span class="text-xl font-black text-white">TO BIM</span>
            <nav class="hidden md:flex items-center gap-2 text-sm font-semibold">
                <a href="dashboard.html" class="text-gray-400 hover:text-white px-4 py-2 rounded-xl transition">الرئيسية</a>
                <a href="subscriptions.html" class="text-gray-400 hover:text-white px-4 py-2 rounded-xl transition">اشتراكاتي</a>
                <a href="new-sub.html" class="bg-blue-600 text-white px-4 py-2 rounded-xl transition">+ اشتراك جديد</a>
            </nav>
        </div>
        <button onclick="localStorage.clear(); location.href='login.html';" class="bg-red-500/10 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl text-sm font-bold">خروج</button>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-6 space-y-6">
        <div class="bg-[#111827] p-8 rounded-3xl border border-gray-800">
            <h2 class="text-xl font-black text-white mb-6">تسجيل اشتراك جديد</h2>

            <form onsubmit="saveSub(event)" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-xs text-gray-400 mb-2">القسم</label>
                        <select id="dept" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl p-3 text-sm text-white outline-none">
                            <option>معماري</option>
                            <option>إنشائي</option>
                            <option>كورسات</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-2">الراوند</label>
                        <select id="round" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl p-3 text-sm text-white outline-none">
                            <option>Round 27</option>
                            <option>Round 26</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-2">الحالة</label>
                        <select id="status" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl p-3 text-sm text-white outline-none">
                            <option value="Rest">Rest (متبقي)</option>
                            <option value="Full Pay">Full Pay</option>
                        </select>
                    </div>
                </div>

                <!-- بند الدفعات -->
                <div class="bg-[#131b2e]/60 p-5 rounded-2xl border border-gray-800 space-y-4">
                    <h3 class="text-sm font-bold text-blue-400">بيانات الدفعة الأولى</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">المبلغ المدفوع</label>
                            <input type="number" id="paid" required placeholder="9500" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl p-2.5 text-sm text-white outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">مصدر الاستقبال</label>
                            <select id="source" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl p-2.5 text-sm text-white outline-none">
                                <option>إنستاباي CIB</option>
                                <option>فودافون كاش</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">اسم المحوّل</label>
                            <input type="text" id="sender" placeholder="اسم المحول" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl p-2.5 text-sm text-white outline-none">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs text-gray-400 mb-2">اسم المشترك ثلاثي</label>
                        <input type="text" id="name" required placeholder="الاسم" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl p-3 text-sm text-white outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-2">موبايل المشترك</label>
                        <input type="text" id="mobile" required placeholder="0111111111" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl p-3 text-sm text-white outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-gray-400 mb-2">سعر البيع الإجمالي (EGP)</label>
                    <input type="number" id="total" required placeholder="12000" class="w-full bg-[#131b2e] border border-gray-700 rounded-xl p-3 text-sm text-white outline-none">
                </div>

                <div class="flex justify-end pt-4">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-8 py-3 rounded-xl transition shadow">حفظ الاشتراك</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        function saveSub(e) {
            e.preventDefault();
            let subs = JSON.parse(localStorage.getItem('tobim_subs') || '[]');
            let total = parseFloat(document.getElementById('total').value);
            let paid = parseFloat(document.getElementById('paid').value);
            let rem = total - paid;

            let newSub = {
                id: Math.floor(200000 + Math.random() * 900000),
                department: document.getElementById('dept').value,
                round: document.getElementById('round').value,
                status: rem <= 0 ? 'Full Pay' : document.getElementById('status').value,
                fullName: document.getElementById('name').value,
                mobile: document.getElementById('mobile').value,
                totalPrice: total,
                paidAmount: paid,
                remainingAmount: rem > 0 ? rem : 0,
                paySource: document.getElementById('source').value,
                senderName: document.getElementById('sender').value || document.getElementById('name').value
            };

            subs.push(newSub);
            localStorage.setItem('tobim_subs', JSON.stringify(subs));
            alert('تم حفظ الاشتراك بنجاح!');
            window.location.href = 'subscriptions.html';
        }
    </script>
</body>
</html>
