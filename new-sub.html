<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBIM — تسجيل اشتراك جديد</title>
    <link rel="icon" type="image/jpeg" href="TobimLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-900/20 via-[#0b0f19] to-[#0b0f19]">

    <!-- الهيدر -->
    <header class="bg-[#0f172a]/80 backdrop-blur-md border-b border-gray-800/60 h-20 flex items-center px-6 justify-between sticky top-0 z-50 transition-all">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3 group cursor-pointer">
                <div class="relative">
                    <div class="absolute inset-0 bg-blue-500 blur-md opacity-0 group-hover:opacity-40 transition duration-500"></div>
                    <img src="TobimLogo.jpg" onerror="this.src='https://via.placeholder.com/40'" class="relative w-10 h-10 rounded-xl object-cover border border-gray-700 shadow-lg" alt="Logo">
                </div>
                <span class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">TO BIM</span>
            </div>
            <nav class="hidden md:flex items-center gap-2 text-sm font-semibold">
                <a href="dashboard.html" class="text-gray-400 hover:text-white hover:bg-gray-800/50 px-4 py-2.5 rounded-xl transition">الماليات</a>
                <a href="subscriptions.html" class="text-gray-400 hover:text-white hover:bg-gray-800/50 px-4 py-2.5 rounded-xl transition">سجل الاشتراكات</a>
                <a href="new-sub.html" class="bg-gradient-to-r from-blue-600 to-blue-500 text-white px-5 py-2.5 rounded-xl shadow-[0_0_15px_rgba(59,130,246,0.3)] transition transform hover:scale-105 flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> اشتراك جديد
                </a>
            </nav>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="localStorage.clear(); location.href='login.html';" class="bg-red-500/10 text-red-400 border border-red-500/30 hover:bg-red-500/20 px-4 py-2 rounded-xl text-sm font-bold transition">خروج</button>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-8 space-y-6 relative z-10">
        
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-2xl font-black text-white">تسجيل اشتراك جديد</h2>
                <p class="text-sm text-gray-400 mt-1">أدخل بيانات العميل وتفاصيل الدفعات بدقة (صورة الإيصال إجبارية)</p>
            </div>
            <button onclick="window.history.back()" class="bg-[#111827] hover:bg-gray-800 border border-gray-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition">
                <i class="fa-solid fa-arrow-left ml-2"></i> رجوع
            </button>
        </div>

        <form id="newSubForm" onsubmit="saveSubscription(event)" class="space-y-6">
            
            <!-- القسم الأول: بيانات المشترك الأساسية -->
            <div class="bg-[#111827]/80 backdrop-blur-xl p-6 rounded-3xl border border-gray-800 shadow-xl">
                <h3 class="text-lg font-bold text-white mb-4 border-b border-gray-800 pb-2"><i class="fa-solid fa-user ml-2 text-blue-500"></i> بيانات المشترك</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">اسم المشترك ثلاثي *</label>
                        <input type="text" id="sub-name" required placeholder="مثال: أحمد عبد الحميد" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">موبايل المشترك *</label>
                        <input type="tel" id="sub-mobile" required placeholder="01xxxxxxxxx" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">البريد الإلكتروني (Email) *</label>
                        <input type="email" id="sub-email" required placeholder="example@gmail.com" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">مسؤول المبيعات (Sales) *</label>
                        <select id="sub-sales" required class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500">
                            <option value="" disabled selected>اختر مسؤول المبيعات</option>
                            <option value="عمر">عمر</option>
                            <option value="محسن">محسن</option>
                            <option value="صباح">صباح</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- القسم الثاني: تفاصيل المنتج والديناميكية -->
            <div class="bg-[#111827]/80 backdrop-blur-xl p-6 rounded-3xl border border-gray-800 shadow-xl">
                <h3 class="text-lg font-bold text-white mb-4 border-b border-gray-800 pb-2"><i class="fa-solid fa-graduation-cap ml-2 text-emerald-500"></i> تفاصيل المنتج والراوند</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">نوع المنتج *</label>
                        <select id="sub-type" required onchange="updateSpecializations()" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500">
                            <option value="" disabled selected>اختر النوع</option>
                            <option value="دبلومة">دبلومة</option>
                            <option value="كورس">كورس</option>
                            <option value="برنامج">برنامج</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">التخصص / الكورس *</label>
                        <select id="sub-spec" required onchange="updateRounds()" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500 disabled:opacity-50" disabled>
                            <option value="" disabled selected>اختر النوع أولاً</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm text-gray-400 mb-2">الراوند الحالي *</label>
                        <select id="sub-round" required class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500 disabled:opacity-50" disabled>
                            <option value="" disabled selected>اختر التخصص أولاً</option>
                        </select>
                    </div>
                </div>

                <!-- خيار محول من راوند -->
                <div class="bg-[#0b0f19] p-4 rounded-xl border border-gray-800">
                    <label class="flex items-center gap-3 cursor-pointer mb-3">
                        <input type="checkbox" id="is-transferred" onchange="toggleTransferSection()" class="w-5 h-5 text-emerald-500 bg-gray-800 border-gray-600 rounded focus:ring-emerald-500 focus:ring-2">
                        <span class="text-white font-bold text-sm">هذا المشترك محول من راوند سابق؟</span>
                    </label>
                    <div id="transfer-section" class="hidden">
                        <label class="block text-sm text-gray-400 mb-2 mt-2">الراوند السابق (المحول منه) *</label>
                        <select id="sub-old-round" class="w-full md:w-1/3 bg-[#111827] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500">
                            <!-- سيتم تعبئتها ديناميكياً بنفس أرقام الراوندات -->
                        </select>
                    </div>
                </div>
            </div>

            <!-- القسم الثالث: الحسابات والدفعة الأولى -->
            <div class="bg-[#111827]/80 backdrop-blur-xl p-6 rounded-3xl border border-gray-800 shadow-xl">
                <h3 class="text-lg font-bold text-white mb-4 border-b border-gray-800 pb-2"><i class="fa-solid fa-money-bill-1-wave ml-2 text-amber-500"></i> بيانات الدفعة الأولى</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">سعر البيع الإجمالي (ج.م) *</label>
                        <input type="number" id="sub-total" required oninput="calcRemaining()" placeholder="مثال: 9800" class="w-full bg-[#0b0f19] border border-gray-700 text-white font-bold rounded-xl px-4 py-2.5 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2 text-emerald-400">المدفوع كدفعة أولى (ج.م) *</label>
                        <input type="number" id="sub-paid-1" required oninput="calcRemaining()" placeholder="مثال: 5000" class="w-full bg-[#0b0f19] border border-gray-700 text-emerald-400 font-bold rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2 text-amber-400">المتبقي (آجل)</label>
                        <input type="number" id="sub-rest" readonly class="w-full bg-[#0b0f19] border border-gray-700 text-amber-400 font-bold rounded-xl px-4 py-2.5 cursor-not-allowed">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">مصدر الاستقبال *</label>
                        <select id="sub-source-1" required class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-amber-500">
                            <option value="" disabled selected>اختر البنك/المحفظة</option>
                            <option value="إنستاباي CIB">إنستاباي CIB</option>
                            <option value="بنك التعمير والإسكان">بنك التعمير والإسكان</option>
                            <option value="فودافون كاش">فودافون كاش</option>
                            <option value="الخزينة (كاش)">الخزينة (كاش)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">تاريخ التحويل *</label>
                        <input type="date" id="sub-date-1" required class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-amber-500" style="color-scheme: dark;">
                    </div>
                    <div class="lg:col-span-2">
                        <label class="block text-sm text-gray-400 mb-2">صورة الإيصال (إجباري) *</label>
                        <!-- جعلنا الصورة إجبارية required -->
                        <input type="file" id="sub-receipt-1" accept="image/*" required class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none focus:border-amber-500">
                    </div>
                </div>
                
                <div class="mt-4">
                    <label class="block text-sm text-gray-400 mb-2">تاريخ استحقاق الدفعة القادمة</label>
                    <input type="date" id="sub-next-date" class="w-full md:w-1/3 bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-amber-500" style="color-scheme: dark;">
                </div>
            </div>

            <!-- القسم الرابع: بيانات الدفعة الثانية (اختياري) -->
            <div class="bg-[#111827]/80 backdrop-blur-xl p-6 rounded-3xl border border-gray-800 shadow-xl">
                <div class="flex justify-between items-center mb-4 border-b border-gray-800 pb-2">
                    <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-money-check-dollar ml-2 text-blue-400"></i> بيانات الدفعة الثانية (اختياري)</h3>
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" id="has-second-payment" onchange="toggleSecondPayment()" class="w-5 h-5 text-blue-500 bg-gray-800 border-gray-600 rounded focus:ring-blue-500 focus:ring-2">
                        <span class="text-white text-sm">تم تسديد دفعة ثانية؟</span>
                    </label>
                </div>
                
                <div id="second-payment-section" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2 text-emerald-400">المدفوع كدفعة ثانية (ج.م) *</label>
                        <input type="number" id="sub-paid-2" oninput="calcRemaining()" placeholder="مثال: 4800" class="w-full bg-[#0b0f19] border border-gray-700 text-emerald-400 font-bold rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">مصدر الاستقبال *</label>
                        <select id="sub-source-2" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500">
                            <option value="" disabled selected>اختر البنك/المحفظة</option>
                            <option value="إنستاباي CIB">إنستاباي CIB</option>
                            <option value="بنك التعمير والإسكان">بنك التعمير والإسكان</option>
                            <option value="فودافون كاش">فودافون كاش</option>
                            <option value="الخزينة (كاش)">الخزينة (كاش)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">تاريخ التحويل *</label>
                        <input type="date" id="sub-date-2" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500" style="color-scheme: dark;">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">صورة الإيصال للدفعة 2 (إجباري) *</label>
                        <!-- الصورة إجبارية فقط في حال تفعيل الدفعة الثانية، سيتم التحكم بها عبر JS -->
                        <input type="file" id="sub-receipt-2" accept="image/*" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none focus:border-blue-500">
                    </div>
                </div>
            </div>

            <!-- زر الحفظ -->
            <div class="flex justify-end mt-8 pb-10">
                <button type="submit" class="bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white px-10 py-3 rounded-xl text-lg font-black transition-all shadow-[0_0_20px_rgba(59,130,246,0.4)] transform hover:scale-105 flex items-center gap-2">
                    <i class="fa-solid fa-check"></i> تسجيل الاشتراك
                </button>
            </div>
        </form>
    </main>

    <script>
        // تعيين تاريخ اليوم كقيمة افتراضية لتواريخ التحويل
        document.getElementById('sub-date-1').valueAsDate = new Date();
        document.getElementById('sub-date-2').valueAsDate = new Date();

        // 1. القوائم المنسدلة الديناميكية للنوع والتخصص
        function updateSpecializations() {
            const typeSelect = document.getElementById('sub-type');
            const specSelect = document.getElementById('sub-spec');
            const roundSelect = document.getElementById('sub-round');
            const oldRoundSelect = document.getElementById('sub-old-round');
            const typeValue = typeSelect.value;

            specSelect.innerHTML = '<option value="" disabled selected>اختر التخصص/الكورس</option>';
            specSelect.disabled = false;
            
            roundSelect.innerHTML = '<option value="" disabled selected>اختر التخصص أولاً</option>';
            roundSelect.disabled = true;
            oldRoundSelect.innerHTML = '';

            if (typeValue === 'دبلومة') {
                specSelect.innerHTML += '<option value="إنشائي">القسم الإنشائي</option>';
                specSelect.innerHTML += '<option value="معماري">القسم المعماري</option>';
            } 
            else if (typeValue === 'كورس') {
                specSelect.innerHTML += '<option value="3ds Max">3ds Max</option>';
                specSelect.innerHTML += '<option value="Revit Structure">Revit Structure</option>';
                specSelect.innerHTML += '<option value="Revit Architecture">Revit Architecture</option>';
            } 
            else if (typeValue === 'برنامج') {
                specSelect.innerHTML += '<option value="أوتوديسك">أوتوديسك</option>';
            }
        }

        // 2. توليد الراوندات ديناميكياً بناءً على التخصص (1-20 لمعماري، 1-30 لإنشائي)
        function updateRounds() {
            const specValue = document.getElementById('sub-spec').value;
            const typeValue = document.getElementById('sub-type').value;
            const roundSelect = document.getElementById('sub-round');
            const oldRoundSelect = document.getElementById('sub-old-round');

            roundSelect.innerHTML = '<option value="" disabled selected>اختر الراوند</option>';
            oldRoundSelect.innerHTML = '<option value="" disabled selected>اختر الراوند السابق</option>';

            // البرامج والكورسات المنفصلة قد لا يكون لها راوندات مرقمة بنفس الطريقة، لكن سنطبق شرط الدبلومة
            if (typeValue === 'برنامج') {
                roundSelect.innerHTML += '<option value="N/A">لا يوجد راوند (N/A)</option>';
                roundSelect.value = 'N/A';
                roundSelect.disabled = true;
            } else {
                roundSelect.disabled = false;
                let maxRound = 0;
                
                if (specValue === 'معماري' || specValue === 'Revit Architecture' || specValue === '3ds Max') {
                    maxRound = 20;
                } else if (specValue === 'إنشائي' || specValue === 'Revit Structure') {
                    maxRound = 30;
                }

                for (let i = 1; i <= maxRound; i++) {
                    const optionHtml = `<option value="Round ${i}">Round ${i}</option>`;
                    roundSelect.innerHTML += optionHtml;
                    oldRoundSelect.innerHTML += optionHtml;
                }
            }
        }

        // 3. التحكم في ظهور قسم الدفعة الثانية
        function toggleSecondPayment() {
            const isChecked = document.getElementById('has-second-payment').checked;
            const section = document.getElementById('second-payment-section');
            const paid2Input = document.getElementById('sub-paid-2');
            const source2Input = document.getElementById('sub-source-2');
            const receipt2Input = document.getElementById('sub-receipt-2');

            if (isChecked) {
                section.classList.remove('hidden');
                paid2Input.required = true;
                source2Input.required = true;
                receipt2Input.required = true; // الصورة إجبارية للدفعة الثانية
            } else {
                section.classList.add('hidden');
                paid2Input.required = false;
                source2Input.required = false;
                receipt2Input.required = false;
                
                paid2Input.value = '';
                source2Input.value = '';
                receipt2Input.value = '';
                calcRemaining(); // إعادة الحساب بدون الدفعة الثانية
            }
        }

        // 4. التحكم في ظهور حقل التحويل من راوند
        function toggleTransferSection() {
            const isTransferred = document.getElementById('is-transferred').checked;
            const transferSection = document.getElementById('transfer-section');
            const oldRound = document.getElementById('sub-old-round');
            
            if (isTransferred) {
                transferSection.classList.remove('hidden');
                oldRound.required = true;
            } else {
                transferSection.classList.add('hidden');
                oldRound.required = false;
                oldRound.value = '';
            }
        }

        // 5. حساب المتبقي الكلي (طرح الدفعة الأولى والثانية)
        function calcRemaining() {
            const total = parseFloat(document.getElementById('sub-total').value) || 0;
            let paid1 = parseFloat(document.getElementById('sub-paid-1').value) || 0;
            let paid2 = 0;
            
            if(document.getElementById('has-second-payment').checked) {
                paid2 = parseFloat(document.getElementById('sub-paid-2').value) || 0;
            }

            let totalPaid = paid1 + paid2;

            if(totalPaid > total) {
                alert("تنبيه: إجمالي المدفوع يتخطى سعر البيع. يرجى مراجعة الأرقام.");
            }
            
            const rest = total - totalPaid;
            document.getElementById('sub-rest').value = rest >= 0 ? rest : 0;
        }

        // 6. دالة الحفظ
        function saveSubscription(e) {
            e.preventDefault(); 
            
            // تحقق أخير للتأكد من المبالغ
            calcRemaining();
            const rest = parseFloat(document.getElementById('sub-rest').value) || 0;
            if (rest < 0) {
                alert("خطأ: إجمالي الدفعات أكبر من سعر البيع. لا يمكن الحفظ.");
                return;
            }

            const name = document.getElementById('sub-name').value;
            const mobile = document.getElementById('sub-mobile').value;
            const email = document.getElementById('sub-email').value;
            const sales = document.getElementById('sub-sales').value;
            
            const type = document.getElementById('sub-type').value;
            const spec = document.getElementById('sub-spec').value;
            const round = document.getElementById('sub-round').value;
            
            // بيانات التحويل من راوند
            const isTransferred = document.getElementById('is-transferred').checked;
            const oldRound = document.getElementById('sub-old-round').value;

            const total = parseFloat(document.getElementById('sub-total').value) || 0;
            const paid1 = parseFloat(document.getElementById('sub-paid-1').value) || 0;
            
            let totalPaid = paid1;
            if(document.getElementById('has-second-payment').checked) {
                totalPaid += parseFloat(document.getElementById('sub-paid-2').value) || 0;
            }
            
            const nextDate = document.getElementById('sub-next-date').value;
            const status = rest === 0 ? 'خالص (Paid)' : 'متبقي (Rest)';

            // جلب البيانات القديمة لتوليد ID
            let subs = JSON.parse(localStorage.getItem('tobim_subs_v7') || '[]');
            let maxId = 201134; 
            if (subs.length > 0) {
                maxId = Math.max(...subs.map(s => s.id));
            }
            const newId = maxId + 1;

            const newSubscription = {
                id: newId,
                fullName: name,
                mobile: mobile,
                email: email, // تمت إضافة الإيميل
                salesRep: sales,
                prodType: type,
                spec: spec,
                round: round,
                isTransferred: isTransferred,
                oldRound: oldRound,
                totalPrice: total,
                paidAmount: totalPaid, // إجمالي المدفوع 1 و 2
                remainingAmount: rest,
                status: status,
                nextPaymentDate: rest === 0 ? '' : nextDate
            };

            subs.unshift(newSubscription);
            localStorage.setItem('tobim_subs_v7', JSON.stringify(subs));

            alert(`تم تسجيل الاشتراك بنجاح!\nالاسم: ${name}\nرقم الاشتراك (ID): ${newId}\n(تم رفع صور الإيصالات بنجاح)`);
            window.location.href = 'subscriptions.html';
        }
    </script>
</body>
</html>
