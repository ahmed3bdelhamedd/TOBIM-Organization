<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBIM — تسجيل اشتراك جديد</title>
    <link rel="icon" type="image/jpeg" href="TobimLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-900/20 via-[#0b0f19] to-[#0b0f19]">

    <!-- الهيدر -->
    <header class="bg-[#0f172a]/80 backdrop-blur-md border-b border-gray-800/60 h-20 flex items-center px-6 justify-between sticky top-0 z-50 transition-all">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3 group cursor-pointer">
                <div class="relative">
                    <div class="absolute inset-0 bg-blue-500 blur-md opacity-0 group-hover:opacity-40 transition duration-500"></div>
                    <img src="TobimLogo.jpg" onerror="this.src='https://via.placeholder.com/40'" class="relative w-10 h-10 rounded-xl object-cover border border-gray-700 shadow-lg" alt="Logo">
                </div>
                <span class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">TO BIM</span>
            </div>
            <nav class="hidden md:flex items-center gap-2 text-sm font-semibold">
                <a href="dashboard.html" class="text-gray-400 hover:text-white hover:bg-gray-800/50 px-4 py-2.5 rounded-xl transition">الماليات</a>
                <a href="subscriptions.html" class="text-gray-400 hover:text-white hover:bg-gray-800/50 px-4 py-2.5 rounded-xl transition">سجل الاشتراكات</a>
                <a href="new-sub.html" class="bg-gradient-to-r from-blue-600 to-blue-500 text-white px-5 py-2.5 rounded-xl shadow-[0_0_15px_rgba(59,130,246,0.3)] transition transform hover:scale-105 flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> اشتراك جديد
                </a>
            </nav>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="localStorage.clear(); location.href='login.html';" class="bg-red-500/10 text-red-400 border border-red-500/30 hover:bg-red-500/20 px-4 py-2 rounded-xl text-sm font-bold transition">خروج</button>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 md:p-8 space-y-6 relative z-10">
        
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-2xl font-black text-white">تسجيل اشتراك جديد</h2>
                <p class="text-sm text-gray-400 mt-1">أدخل بيانات العميل وتفاصيل الدفعة الأولى بدقة</p>
            </div>
            <button onclick="window.history.back()" class="bg-[#111827] hover:bg-gray-800 border border-gray-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition">
                <i class="fa-solid fa-arrow-left ml-2"></i> رجوع
            </button>
        </div>

        <form id="newSubForm" onsubmit="saveSubscription(event)" class="space-y-6">
            
            <!-- القسم الأول: بيانات المشترك الأساسية -->
            <div class="bg-[#111827]/80 backdrop-blur-xl p-6 rounded-3xl border border-gray-800 shadow-xl">
                <h3 class="text-lg font-bold text-white mb-4 border-b border-gray-800 pb-2"><i class="fa-solid fa-user ml-2 text-blue-500"></i> بيانات المشترك</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">اسم المشترك ثلاثي *</label>
                        <input type="text" id="sub-name" required placeholder="مثال: أحمد عبد الحميد" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">موبايل المشترك *</label>
                        <input type="tel" id="sub-mobile" required placeholder="01xxxxxxxxx" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">مسؤول المبيعات (Sales) *</label>
                        <select id="sub-sales" required class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500">
                            <option value="عمر">عمر</option>
                            <option value="محسن">محسن</option>
                            <option value="صباح">صباح</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- القسم الثاني: تفاصيل الكورس/البرنامج -->
            <div class="bg-[#111827]/80 backdrop-blur-xl p-6 rounded-3xl border border-gray-800 shadow-xl">
                <h3 class="text-lg font-bold text-white mb-4 border-b border-gray-800 pb-2"><i class="fa-solid fa-graduation-cap ml-2 text-emerald-500"></i> تفاصيل المنتج</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">نوع المنتج *</label>
                        <select id="sub-type" required class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500">
                            <option value="دبلومة">دبلومة</option>
                            <option value="كورس">كورس</option>
                            <option value="برنامج">برنامج</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">القسم / التخصص *</label>
                        <select id="sub-spec" required class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500">
                            <option value="معماري">معماري</option>
                            <option value="إنشائي">إنشائي</option>
                            <option value="أوتوديسك">أوتوديسك</option>
                            <option value="عام">عام</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">الراوند</label>
                        <input type="text" id="sub-round" placeholder="مثال: Round 27" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
            </div>

            <!-- القسم الثالث: بيانات الدفعة الأولى -->
            <div class="bg-[#111827]/80 backdrop-blur-xl p-6 rounded-3xl border border-gray-800 shadow-xl">
                <h3 class="text-lg font-bold text-white mb-4 border-b border-gray-800 pb-2"><i class="fa-solid fa-money-bill-wave ml-2 text-amber-500"></i> الحسابات وبيانات الدفع</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">سعر البيع الإجمالي (ج.م) *</label>
                        <input type="number" id="sub-total" required oninput="calcRemaining()" placeholder="مثال: 12000" class="w-full bg-[#0b0f19] border border-gray-700 text-white font-bold rounded-xl px-4 py-2.5 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2 text-emerald-400">المبلغ المدفوع (ج.م) *</label>
                        <input type="number" id="sub-paid" required oninput="calcRemaining()" placeholder="مثال: 9500" class="w-full bg-[#0b0f19] border border-gray-700 text-emerald-400 font-bold rounded-xl px-4 py-2.5 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2 text-amber-400">المتبقي (آجل)</label>
                        <input type="number" id="sub-rest" readonly class="w-full bg-[#0b0f19] border border-gray-700 text-amber-400 font-bold rounded-xl px-4 py-2.5 cursor-not-allowed">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">مصدر الاستقبال *</label>
                        <select id="sub-source" required class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-amber-500">
                            <option value="إنستاباي CIB">إنستاباي CIB</option>
                            <option value="بنك التعمير والإسكان">بنك التعمير والإسكان</option>
                            <option value="فودافون كاش">فودافون كاش</option>
                            <option value="الخزينة (كاش)">الخزينة (كاش)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">اسم المحول</label>
                        <input type="text" id="sub-sender" placeholder="اسم صاحب الحساب المحول" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">تاريخ الدفعة القادمة</label>
                        <input type="date" id="sub-next-date" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-amber-500" style="color-scheme: dark;">
                        <p class="text-[10px] text-gray-500 mt-1">يُترك فارغاً إذا كان المبلغ خالصاً.</p>
                    </div>
                </div>

                <div class="mt-6">
                    <label class="block text-sm text-gray-400 mb-2">صورة الإيصال المرفقة (اختياري)</label>
                    <input type="file" id="sub-receipt-img" accept="image/*" class="w-full bg-[#0b0f19] border border-gray-700 text-gray-400 rounded-xl px-4 py-2.5 focus:outline-none focus:border-amber-500">
                </div>
            </div>

            <!-- زر الحفظ -->
            <div class="flex justify-end mt-8">
                <button type="submit" class="bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white px-10 py-3 rounded-xl text-lg font-black transition-all shadow-[0_0_20px_rgba(59,130,246,0.4)] transform hover:scale-105">
                    حفظ الاشتراك
                </button>
            </div>
        </form>

    </main>

    <script>
        // دالة حساب المتبقي تلقائياً
        function calcRemaining() {
            const total = parseFloat(document.getElementById('sub-total').value) || 0;
            let paid = parseFloat(document.getElementById('sub-paid').value) || 0;
            
            // منع إدخال مدفوع أكبر من السعر الكلي
            if(paid > total) {
                paid = total;
                document.getElementById('sub-paid').value = total;
            }
            
            const rest = total - paid;
            document.getElementById('sub-rest').value = rest;
        }

        // دالة الحفظ
        function saveSubscription(e) {
            e.preventDefault(); // منع تحديث الصفحة الافتراضي للـ Form

            // جلب القيم من الفورم
            const name = document.getElementById('sub-name').value;
            const mobile = document.getElementById('sub-mobile').value;
            const sales = document.getElementById('sub-sales').value;
            
            const type = document.getElementById('sub-type').value;
            const spec = document.getElementById('sub-spec').value;
            const round = document.getElementById('sub-round').value || 'N/A';
            
            const total = parseFloat(document.getElementById('sub-total').value) || 0;
            const paid = parseFloat(document.getElementById('sub-paid').value) || 0;
            const rest = parseFloat(document.getElementById('sub-rest').value) || 0;
            
            const source = document.getElementById('sub-source').value;
            const sender = document.getElementById('sub-sender').value;
            const nextDate = document.getElementById('sub-next-date').value;

            // تحديد الحالة
            const status = rest === 0 ? 'خالص (Paid)' : 'متبقي (Rest)';

            // جلب الاشتراكات الحالية لإنشاء ID متسلسل وإضافة الجديد
            let subs = JSON.parse(localStorage.getItem('tobim_subs_v7') || '[]');
            
            // توليد ID جديد أعلى من آخر ID موجود
            let maxId = 201134; // بداية افتراضية
            if (subs.length > 0) {
                maxId = Math.max(...subs.map(s => s.id));
            }
            const newId = maxId + 1;

            const newSubscription = {
                id: newId,
                fullName: name,
                mobile: mobile,
                salesRep: sales,
                prodType: type,
                spec: spec,
                round: round,
                totalPrice: total,
                paidAmount: paid,
                remainingAmount: rest,
                status: status,
                paySource: source,
                senderName: sender,
                nextPaymentDate: rest === 0 ? '' : nextDate // تفريغ التاريخ لو خالص
            };

            // إدراج في أول القائمة
            subs.unshift(newSubscription);
            
            // حفظ في الـ LocalStorage
            localStorage.setItem('tobim_subs_v7', JSON.stringify(subs));

            alert(`تم تسجيل اشتراك ${name} بنجاح! رقم الـ ID الخاص به هو: ${newId}`);
            
            // تحويل المستخدم لصفحة سجل الاشتراكات
            window.location.href = 'subscriptions.html';
        }
    </script>
</body>
</html>
