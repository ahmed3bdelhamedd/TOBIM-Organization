<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBIM — إدارة الرواتب</title>
    <link rel="icon" type="image/jpeg" href="TobimLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex flex-col">

    <!-- الهيدر الرئيسي -->
    <header class="bg-[#0f172a] border-b border-gray-800 h-20 flex items-center px-6 justify-between sticky top-0 z-40">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <img src="TobimLogo.jpg" onerror="this.src='https://via.placeholder.com/40'" class="w-10 h-10 rounded-xl object-cover border border-gray-700" alt="Logo">
                <span class="text-xl font-black text-white">TO BIM</span>
            </div>
            <nav class="hidden md:flex items-center gap-2 text-sm font-semibold">
                <a href="dashboard.html" class="bg-blue-600 text-white px-4 py-2 rounded-xl transition shadow-lg shadow-blue-600/20">الماليات</a>
                <a href="subscriptions.html" class="text-gray-400 hover:text-white px-4 py-2 rounded-xl transition">الاشتراكات</a>
            </nav>
        </div>
        <button onclick="localStorage.clear(); location.href='login.html';" class="bg-red-500/10 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl text-sm font-bold hover:bg-red-500/20 transition">خروج</button>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8 space-y-6">
        
        <!-- شريط التنقل (Sub-header) -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 border-b border-gray-800 mb-6">
            <a href="dashboard.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-5 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition"><i class="fa-solid fa-chart-pie ml-2"></i>الداشبورد العام</a>
            <a href="payroll.html" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap"><i class="fa-solid fa-users ml-2"></i>إدارة الرواتب</a>
            <a href="marketing.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-5 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition"><i class="fa-solid fa-bullhorn ml-2"></i>التسويق</a>
            <a href="expenses.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-5 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition"><i class="fa-solid fa-receipt ml-2"></i>المصروفات العامة</a>
        </div>

        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-black text-white">رواتب الموظفين</h2>
            <button class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition">
                <i class="fa-solid fa-check-double ml-1"></i> اعتماد رواتب الشهر
            </button>
        </div>

        <!-- فلاتر التقارير والمدة والقسم -->
        <div class="bg-[#111827] p-5 rounded-3xl border border-gray-800 flex flex-wrap items-end gap-4 mb-6">
            <div>
                <label class="block text-sm text-gray-400 mb-2">القسم</label>
                <!-- إضافة فلتر القسم -->
                <select id="filter-dept" onchange="filterEmployees()" class="bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none focus:border-blue-500 w-40">
                    <option value="الكل">جميع الأقسام</option>
                    <option value="الإدارة">الإدارة</option>
                    <option value="التسويق">التسويق</option>
                    <option value="المبيعات">المبيعات</option>
                    <option value="تقنية المعلومات">تقنية المعلومات</option>
                    <option value="الموارد البشرية">الموارد البشرية</option>
                    <option value="الخدمات">الخدمات</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">الشهر</label>
                <select class="bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none focus:border-blue-500 w-32">
                    <option value="1">يناير</option>
                    <option value="11" selected>نوفمبر</option>
                    <option value="12">ديسمبر</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">السنة</label>
                <select class="bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none focus:border-blue-500 w-32">
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                </select>
            </div>
            <button class="bg-gray-800 hover:bg-gray-700 text-white px-6 py-2.5 rounded-xl text-sm font-bold transition flex-1 md:flex-none">
                <i class="fa-solid fa-file-export ml-1"></i> استخراج كشف الرواتب
            </button>
        </div>

        <!-- قسم إدارة الرواتب -->
        <div class="bg-[#111827] rounded-3xl border border-gray-800 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse min-w-[900px]">
                    <thead>
                        <tr class="bg-[#0f172a] text-gray-400 text-sm border-b border-gray-800">
                            <th class="p-4 font-semibold">الموظف</th>
                            <th class="p-4 font-semibold">القسم</th>
                            <th class="p-4 font-semibold">الراتب الأساسي</th>
                            <th class="p-4 font-semibold text-emerald-400">عمولة / مكافأة (+)</th>
                            <th class="p-4 font-semibold text-rose-400">خصم / سلف (-)</th>
                            <th class="p-4 font-semibold">الصافي المستحق</th>
                        </tr>
                    </thead>
                    <tbody id="employees-tbody" class="divide-y divide-gray-800/50">
                        <!-- سيتم التوليد بواسطة جافاسكريبت -->
                    </tbody>
                </table>
            </div>
            
            <!-- ملخص إجمالي الرواتب -->
            <div class="bg-[#0f172a] p-4 border-t border-gray-800 flex justify-between items-center">
                <span class="text-gray-400 font-bold">إجمالي الرواتب المستحقة (للقسم المختار):</span>
                <span id="total-payroll" class="text-2xl font-black text-white">0 ج.م</span>
            </div>
        </div>

    </main>

    <!-- سكريبت إدارة الرواتب -->
    <script>
        // الأقسام المتاحة
        const departments = ['الإدارة', 'التسويق', 'المبيعات', 'تقنية المعلومات', 'الموارد البشرية', 'الخدمات'];

        // بيانات الموظفين مع الأقسام
        const employees = [
            { id: 1, name: "صلاح البدوي", role: "المدير", department: "الإدارة", baseSalary: 40000, isManager: true },
            { id: 2, name: "هشام غيب", role: "موظف", department: "المبيعات", baseSalary: 8000, isManager: false },
            { id: 3, name: "أحمد عبد الحميد", role: "موظف", department: "التسويق", baseSalary: 6500, isManager: false },
            { id: 4, name: "عمر عبد العزيز", role: "موظف", department: "المبيعات", baseSalary: 6500, isManager: false },
            { id: 5, name: "صباح شعبان", role: "موظف", department: "الموارد البشرية", baseSalary: 6500, isManager: false },
            { id: 6, name: "محسن إسلام", role: "موظف", department: "تقنية المعلومات", baseSalary: 10000, isManager: false },
            { id: 7, name: "صلاح الدين", role: "موظف", department: "الخدمات", baseSalary: 4500, isManager: false },
            { id: 8, name: "عامر علي", role: "موظف", department: "الإدارة", baseSalary: 160000, isManager: false }
        ];

        const tbody = document.getElementById('employees-tbody');
        const totalPayrollElement = document.getElementById('total-payroll');

        // رسم الجدول
        function renderEmployees() {
            tbody.innerHTML = '';
            employees.forEach(emp => {
                const tr = document.createElement('tr');
                tr.id = `row_${emp.id}`;
                tr.className = "hover:bg-gray-800/30 transition group emp-row";
                tr.setAttribute('data-dept', emp.department); // لتسهيل الفلترة
                
                const managerBadge = emp.isManager ? `<span class="bg-amber-500/20 text-amber-400 text-xs px-2 py-1 rounded-md font-bold mr-2 border border-amber-500/20">المدير</span>` : '';
                
                // توليد قائمة الأقسام المنسدلة
                const deptOptions = departments.map(d => `<option value="${d}" ${emp.department === d ? 'selected' : ''}>${d}</option>`).join('');

                tr.innerHTML = `
                    <td class="p-4">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center text-gray-400 font-bold border border-gray-700">
                                ${emp.name.charAt(0)}
                            </div>
                            <div>
                                <p class="text-white font-bold text-sm">${emp.name} ${managerBadge}</p>
                            </div>
                        </div>
                    </td>
                    <td class="p-4">
                        <select onchange="changeDepartment(${emp.id}, this.value)" class="bg-[#0b0f19] border border-gray-700 text-gray-300 text-sm rounded-lg px-2 py-1.5 focus:outline-none focus:border-blue-500 transition">
                            ${deptOptions}
                        </select>
                    </td>
                    <td class="p-4 font-bold text-gray-300">
                        ${emp.baseSalary.toLocaleString()} <span class="text-xs text-gray-500 font-normal">ج.م</span>
                    </td>
                    <td class="p-4">
                        <div class="relative">
                            <input type="number" id="comm_${emp.id}" value="0" min="0" oninput="calculateNet(${emp.id}, ${emp.baseSalary})" class="w-24 bg-[#0b0f19] border border-gray-700 text-emerald-400 text-sm rounded-lg px-2 py-1.5 focus:outline-none focus:border-emerald-500 transition">
                        </div>
                    </td>
                    <td class="p-4">
                        <div class="relative">
                            <input type="number" id="ded_${emp.id}" value="0" min="0" oninput="calculateNet(${emp.id}, ${emp.baseSalary})" class="w-24 bg-[#0b0f19] border border-gray-700 text-rose-400 text-sm rounded-lg px-2 py-1.5 focus:outline-none focus:border-rose-500 transition">
                        </div>
                    </td>
                    <td class="p-4">
                        <span id="net_${emp.id}" class="text-lg font-black text-blue-400" data-net="${emp.baseSalary}">
                            ${emp.baseSalary.toLocaleString()} <span class="text-xs text-gray-500 font-normal">ج.م</span>
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            updateTotalPayroll();
        }

        // تغيير قسم الموظف
        window.changeDepartment = function(id, newDept) {
            const emp = employees.find(e => e.id === id);
            if(emp) {
                emp.department = newDept;
                document.getElementById(`row_${id}`).setAttribute('data-dept', newDept);
                filterEmployees(); // تحديث العرض بناءً على الفلتر النشط
            }
        };

        // تصفية الجدول بناءً على القسم
        window.filterEmployees = function() {
            const selectedDept = document.getElementById('filter-dept').value;
            const rows = document.querySelectorAll('.emp-row');
            
            rows.forEach(row => {
                if (selectedDept === 'الكل' || row.getAttribute('data-dept') === selectedDept) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
            
            updateTotalPayroll(); // تحديث الإجمالي بعد الفلترة
        };

        // دالة حساب الصافي للموظف الواحد
        window.calculateNet = function(id, base) {
            let comm = parseFloat(document.getElementById(`comm_${id}`).value) || 0;
            let ded = parseFloat(document.getElementById(`ded_${id}`).value) || 0;
            
            let net = base + comm - ded;
            
            const netElement = document.getElementById(`net_${id}`);
            netElement.innerHTML = `${net.toLocaleString()} <span class="text-xs text-gray-500 font-normal">ج.م</span>`;
            netElement.setAttribute('data-net', net); 
            
            if (net > base) {
                netElement.className = "text-lg font-black text-emerald-400";
            } else if (net < base) {
                netElement.className = "text-lg font-black text-rose-400";
            } else {
                netElement.className = "text-lg font-black text-blue-400";
            }

            updateTotalPayroll();
        };

        // دالة لحساب الإجمالي الكلي للموظفين الظاهرين في الجدول
        function updateTotalPayroll() {
            let total = 0;
            const rows = document.querySelectorAll('.emp-row');
            
            rows.forEach(row => {
                // نجمع رواتب الموظفين الغير مخفيين بالفلتر فقط
                if(row.style.display !== 'none') {
                    const id = row.id.split('_')[1];
                    const netElement = document.getElementById(`net_${id}`);
                    if(netElement) {
                        total += parseFloat(netElement.getAttribute('data-net')) || 0;
                    }
                }
            });
            
            totalPayrollElement.innerHTML = `${total.toLocaleString()} <span class="text-sm font-normal text-gray-500">ج.م</span>`;
        }

        // تشغيل الدالة عند تحميل الصفحة
        renderEmployees();
    </script>
</body>
</html>
