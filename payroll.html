<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBIM — إدارة الرواتب</title>
    <link rel="icon" type="image/jpeg" href="TobimLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex flex-col">

    <!-- الهيدر الرئيسي -->
    <header class="bg-[#0f172a] border-b border-gray-800 h-20 flex items-center px-6 justify-between sticky top-0 z-40">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3 group cursor-pointer">
                <div class="relative">
                    <div class="absolute inset-0 bg-blue-500 blur-md opacity-0 group-hover:opacity-40 transition duration-500"></div>
                    <img src="TobimLogo.jpg" onerror="this.src='https://via.placeholder.com/40'" class="relative w-10 h-10 rounded-xl object-cover border border-gray-700 shadow-lg" alt="Logo">
                </div>
                <span class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">TO BIM</span>
            </div>
            <nav class="hidden md:flex items-center gap-2 text-sm font-semibold">
                <a href="dashboard.html" class="bg-blue-600 text-white px-4 py-2 rounded-xl transition shadow-lg shadow-blue-600/20">الماليات</a>
                <a href="subscriptions.html" class="text-gray-400 hover:text-white px-4 py-2 rounded-xl transition">الاشتراكات</a>
                <a href="new-sub.html" class="text-gray-400 hover:text-white hover:bg-gray-800/50 px-5 py-2.5 rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> اشتراك جديد
                </a>
            </nav>
        </div>
        <button onclick="localStorage.clear(); location.href='login.html';" class="bg-red-500/10 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl text-sm font-bold hover:bg-red-500/20 transition">خروج</button>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8 space-y-6 relative z-10">
        
        <!-- شريط التنقل المتكامل -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 border-b border-gray-800 mb-6">
            <a href="dashboard.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-5 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition"><i class="fa-solid fa-chart-pie ml-2"></i>الداشبورد العام</a>
            <a href="statements.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-5 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition"><i class="fa-solid fa-file-invoice-dollar ml-2"></i>كشف الحسابات</a>
            <a href="payroll.html" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap"><i class="fa-solid fa-users ml-2"></i>إدارة الرواتب</a>
            <a href="marketing.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-5 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition"><i class="fa-solid fa-bullhorn ml-2"></i>التسويق</a>
            <a href="expenses.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-5 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition"><i class="fa-solid fa-receipt ml-2"></i>المصروفات العامة</a>
        </div>

        <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
            <h2 class="text-2xl font-black text-white">رواتب الموظفين</h2>
            <div class="flex gap-3">
                <button onclick="openEmployeeModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition shadow-lg shadow-blue-900/50 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> إضافة موظف جديد
                </button>
                <button class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-check-double"></i> اعتماد الرواتب
                </button>
            </div>
        </div>

        <!-- فلاتر التقارير والمدة والقسم -->
        <div class="bg-[#111827] p-5 rounded-3xl border border-gray-800 flex flex-wrap items-end gap-4 mb-6 shadow-lg">
            <div>
                <label class="block text-sm text-gray-400 mb-2">القسم</label>
                <select id="filter-dept" onchange="renderDepartments()" class="bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none focus:border-blue-500 w-40">
                    <option value="الكل">جميع الأقسام</option>
                    <option value="الإدارة">الإدارة</option>
                    <option value="المبيعات">المبيعات</option>
                    <option value="تقنية المعلومات">تقنية المعلومات</option>
                    <option value="الجرافيك">الجرافيك</option>
                    <option value="المدربين">المدربين</option>
                    <option value="السوشيال ميديا">السوشيال ميديا</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">الشهر</label>
                <select class="bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none focus:border-blue-500 w-32">
                    <option value="1">يناير</option>
                    <option value="11" selected>نوفمبر</option>
                    <option value="12">ديسمبر</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-2">السنة</label>
                <select class="bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none focus:border-blue-500 w-32">
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                </select>
            </div>
            <button class="bg-gray-800 hover:bg-gray-700 text-white px-6 py-2.5 rounded-xl text-sm font-bold transition flex-1 md:flex-none">
                <i class="fa-solid fa-file-export ml-1"></i> استخراج التقرير
            </button>
        </div>

        <!-- حاوية الأقسام -->
        <div id="departments-container" class="space-y-8">
            <!-- سيتم توليد الجداول هنا -->
        </div>

        <!-- الإجمالي العام -->
        <div id="grand-total-container" class="bg-gradient-to-r from-blue-900/40 to-[#111827] p-6 rounded-3xl border border-blue-500/30 shadow-[0_0_20px_rgba(59,130,246,0.15)] flex justify-between items-center mt-8">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-sack-dollar text-blue-400 text-3xl"></i>
                <span class="text-xl font-bold text-blue-200">الإجمالي العام للرواتب</span>
            </div>
            <span id="grand-total-payroll" class="text-4xl font-black text-white">0 <span class="text-lg font-normal text-blue-300">ج.م</span></span>
        </div>

    </main>

    <!-- النافذة المنبثقة لإضافة موظف جديد -->
    <div id="newEmployeeModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm transition-all">
        <div class="bg-[#111827] border border-gray-800 p-6 rounded-3xl w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-black text-white mb-6 flex items-center gap-2">
                <i class="fa-solid fa-user-plus text-blue-500"></i> تسجيل موظف جديد
            </h3>
            
            <form onsubmit="saveNewEmployee(event)" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">اسم الموظف *</label>
                    <input type="text" id="newEmpName" required class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none focus:border-blue-500">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-1">المسمى الوظيفي *</label>
                    <input type="text" id="newEmpRole" required placeholder="مثال: محاسب، مصمم، سيلز" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-1">القسم *</label>
                    <select id="newEmpDept" required class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none focus:border-blue-500">
                        <option value="الإدارة">الإدارة</option>
                        <option value="المبيعات">المبيعات</option>
                        <option value="تقنية المعلومات">تقنية المعلومات</option>
                        <option value="الجرافيك">الجرافيك</option>
                        <option value="المدربين">المدربين</option>
                        <option value="السوشيال ميديا">السوشيال ميديا</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-1">الراتب الأساسي (ج.م) *</label>
                    <input type="number" id="newEmpSalary" required class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none focus:border-blue-500">
                </div>

                <div class="pt-2">
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" id="newEmpIsManager" class="w-5 h-5 text-blue-500 bg-gray-800 border-gray-600 rounded focus:ring-blue-500">
                        <span class="text-white font-bold text-sm">هذا الموظف يشغل منصب إداري (مدير قسم)؟</span>
                    </label>
                </div>

                <div class="flex gap-3 mt-8 pt-4">
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-bold transition shadow-lg shadow-blue-900/50">حفظ الموظف</button>
                    <button type="button" onclick="closeEmployeeModal()" class="flex-1 bg-transparent hover:bg-gray-800 border border-gray-700 text-white px-4 py-2.5 rounded-xl font-bold transition">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <!-- سكريبت إدارة الرواتب -->
    <script>
        // دمج المعماري والإنشائي تحت قسم "المدربين"
        const departmentsList = ['الإدارة', 'المبيعات', 'تقنية المعلومات', 'الجرافيك', 'المدربين', 'السوشيال ميديا'];

        // تحديث بيانات الموظفين
        const defaultEmployees = [
            { id: 1, name: "صلاح البدوي", role: "المدير", department: "الإدارة", baseSalary: 40000, isManager: true },
            { id: 2, name: "هشام غيب", role: "محاسب مالي", department: "الإدارة", baseSalary: 8000, isManager: false },
            { id: 7, name: "صلاح الدين", role: "عامل نظافة", department: "الإدارة", baseSalary: 4500, isManager: false },
            { id: 5, name: "صباح شعبان", role: "موظف مبيعات", department: "المبيعات", baseSalary: 6500, isManager: false },
            { id: 6, name: "محسن إسلام", role: "موظف مبيعات", department: "المبيعات", baseSalary: 10000, isManager: false },
            { id: 4, name: "عمر عبد العزيز", role: "موظف مبيعات", department: "المبيعات", baseSalary: 6500, isManager: false },
            { id: 3, name: "أحمد عبد الحميد", role: "موظف IT", department: "تقنية المعلومات", baseSalary: 6500, isManager: false },
            { id: 8, name: "عامر علي", role: "مصمم جرافيك", department: "الجرافيك", baseSalary: 16000, isManager: false },
            // إضافة المدربين تحت قسم المدربين مع توضيح التخصص في المسمى الوظيفي
            { id: 9, name: "حسناء يسري", role: "مدرب معماري", department: "المدربين", baseSalary: 5500, isManager: false },
            { id: 10, name: "مصطفى حنفي", role: "مدرب إنشائي", department: "المدربين", baseSalary: 7000, isManager: false },
            { id: 11, name: "سحر الوزير", role: "أخصائي سوشيال ميديا", department: "السوشيال ميديا", baseSalary: 7000, isManager: false }
        ];

        let employees = JSON.parse(localStorage.getItem('tobim_employees_v5'));
        if (!employees || employees.length === 0) {
            employees = defaultEmployees;
            localStorage.setItem('tobim_employees_v5', JSON.stringify(employees));
        }

        const container = document.getElementById('departments-container');
        const grandTotalContainer = document.getElementById('grand-total-container');
        const grandTotalElement = document.getElementById('grand-total-payroll');

        let subTotals = {};

        function renderDepartments() {
            container.innerHTML = '';
            subTotals = {};
            let grandTotal = 0;

            const selectedDept = document.getElementById('filter-dept').value;

            let deptsToRender = departmentsList;
            if (selectedDept !== 'الكل') {
                deptsToRender = [selectedDept];
                grandTotalContainer.classList.add('hidden');
            } else {
                grandTotalContainer.classList.remove('hidden');
            }

            deptsToRender.forEach(dept => {
                const deptEmployees = employees.filter(emp => emp.department === dept);
                
                if (deptEmployees.length > 0) {
                    const deptSection = document.createElement('div');
                    deptSection.className = "bg-[#111827]/80 backdrop-blur-xl rounded-3xl border border-gray-800 overflow-hidden shadow-xl mb-8";
                    
                    let deptIcon = 'fa-users';
                    if(dept === 'الإدارة') deptIcon = 'fa-briefcase';
                    else if(dept === 'المبيعات') deptIcon = 'fa-handshake';
                    else if(dept === 'تقنية المعلومات') deptIcon = 'fa-laptop-code';
                    else if(dept === 'الجرافيك') deptIcon = 'fa-palette';
                    else if(dept === 'المدربين') deptIcon = 'fa-chalkboard-user';
                    else if(dept === 'السوشيال ميديا') deptIcon = 'fa-share-nodes';

                    const headerHtml = `
                        <div class="bg-[#0f172a] p-4 border-b border-gray-800 flex items-center gap-3">
                            <i class="fa-solid ${deptIcon} text-blue-400 text-lg"></i>
                            <h3 class="font-bold text-white text-lg">قسم ${dept}</h3>
                        </div>
                    `;

                    let tableRows = '';
                    let deptSubTotal = 0;

                    deptEmployees.forEach(emp => {
                        const managerBadge = emp.isManager ? `<span class="bg-amber-500/20 text-amber-400 text-xs px-2 py-1 rounded-md font-bold mr-2 border border-amber-500/20 shadow-sm">المدير</span>` : '';
                        
                        const deptOptions = departmentsList.map(d => `<option value="${d}" ${emp.department === d ? 'selected' : ''}>${d}</option>`).join('');

                        const commValue = localStorage.getItem(`comm_${emp.id}`) || 0;
                        const dedValue = localStorage.getItem(`ded_${emp.id}`) || 0;
                        const netValue = parseFloat(emp.baseSalary) + parseFloat(commValue) - parseFloat(dedValue);
                        
                        deptSubTotal += netValue;

                        let netColorClass = "text-blue-400";
                        if(netValue > emp.baseSalary) netColorClass = "text-emerald-400";
                        else if(netValue < emp.baseSalary) netColorClass = "text-rose-400";

                        tableRows += `
                            <tr id="row_${emp.id}" class="hover:bg-gray-800/30 transition group">
                                <td class="p-4">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-gray-800 to-gray-700 flex items-center justify-center text-gray-300 font-bold border border-gray-600 shadow-inner">
                                            ${emp.name.charAt(0)}
                                        </div>
                                        <div>
                                            <p class="text-white font-bold text-sm">${emp.name} ${managerBadge}</p>
                                            <p class="text-xs text-blue-400 mt-1">${emp.role}</p>
                                        </div>
                                    </div>
                                </td>
                                <td class="p-4">
                                    <select onchange="changeDepartment(${emp.id}, this.value)" class="bg-[#0b0f19] border border-gray-700 text-gray-300 text-sm rounded-lg px-2 py-1.5 focus:outline-none focus:border-blue-500 transition cursor-pointer">
                                        ${deptOptions}
                                    </select>
                                </td>
                                <td class="p-4 font-bold text-gray-300">
                                    ${parseFloat(emp.baseSalary).toLocaleString()} <span class="text-xs text-gray-500 font-normal">ج.م</span>
                                </td>
                                <td class="p-4">
                                    <div class="relative">
                                        <input type="number" id="comm_${emp.id}" value="${commValue}" min="0" oninput="calculateNet(${emp.id}, ${emp.baseSalary}, '${dept}')" class="w-24 bg-[#0b0f19] border border-gray-700 text-emerald-400 font-bold text-sm rounded-lg px-2 py-1.5 focus:outline-none focus:border-emerald-500 transition">
                                    </div>
                                </td>
                                <td class="p-4">
                                    <div class="relative">
                                        <input type="number" id="ded_${emp.id}" value="${dedValue}" min="0" oninput="calculateNet(${emp.id}, ${emp.baseSalary}, '${dept}')" class="w-24 bg-[#0b0f19] border border-gray-700 text-rose-400 font-bold text-sm rounded-lg px-2 py-1.5 focus:outline-none focus:border-rose-500 transition">
                                    </div>
                                </td>
                                <td class="p-4">
                                    <span id="net_${emp.id}" class="text-lg font-black ${netColorClass}" data-net="${netValue}">
                                        ${netValue.toLocaleString()} <span class="text-xs text-gray-500 font-normal">ج.م</span>
                                    </span>
                                </td>
                            </tr>
                        `;
                    });

                    subTotals[dept] = deptSubTotal;
                    grandTotal += deptSubTotal;

                    const tableHtml = `
                        <div class="overflow-x-auto">
                            <table class="w-full text-right border-collapse min-w-[900px]">
                                <thead class="bg-[#0f172a]/50">
                                    <tr class="text-gray-400 text-sm border-b border-gray-800">
                                        <th class="p-4 font-semibold w-[25%]">الموظف والوظيفة</th>
                                        <th class="p-4 font-semibold">نقل إلى قسم</th>
                                        <th class="p-4 font-semibold">الراتب الأساسي</th>
                                        <th class="p-4 font-semibold text-emerald-400">عمولة / مكافأة (+)</th>
                                        <th class="p-4 font-semibold text-rose-400">خصم / سلف (-)</th>
                                        <th class="p-4 font-semibold">الصافي المستحق</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-800/50">
                                    ${tableRows}
                                </tbody>
                            </table>
                        </div>
                    `;

                    const footerHtml = `
                        <div class="bg-[#0f172a] p-4 border-t border-gray-800 flex justify-between items-center">
                            <span class="text-gray-400 font-bold">إجمالي رواتب قسم ${dept}:</span>
                            <span id="subtotal_${dept}" class="text-2xl font-black text-white">${deptSubTotal.toLocaleString()} <span class="text-sm font-normal text-gray-500">ج.م</span></span>
                        </div>
                    `;

                    deptSection.innerHTML = headerHtml + tableHtml + footerHtml;
                    container.appendChild(deptSection);
                }
            });

            if (selectedDept === 'الكل') {
                grandTotalElement.innerHTML = `${grandTotal.toLocaleString()} <span class="text-lg font-normal text-blue-300">ج.م</span>`;
            }
        }

        window.calculateNet = function(id, base, dept) {
            let comm = parseFloat(document.getElementById(`comm_${id}`).value) || 0;
            let ded = parseFloat(document.getElementById(`ded_${id}`).value) || 0;
            
            localStorage.setItem(`comm_${id}`, comm);
            localStorage.setItem(`ded_${id}`, ded);

            let net = parseFloat(base) + comm - ded;
            
            const netElement = document.getElementById(`net_${id}`);
            netElement.innerHTML = `${net.toLocaleString()} <span class="text-xs text-gray-500 font-normal">ج.م</span>`;
            netElement.setAttribute('data-net', net); 
            
            if (net > base) netElement.className = "text-lg font-black text-emerald-400";
            else if (net < base) netElement.className = "text-lg font-black text-rose-400";
            else netElement.className = "text-lg font-black text-blue-400";

            updateTotals(dept);
        };

        function updateTotals(changedDept) {
            let deptTotal = 0;
            const deptEmployees = employees.filter(emp => emp.department === changedDept);
            
            deptEmployees.forEach(emp => {
                const netElement = document.getElementById(`net_${emp.id}`);
                if(netElement) {
                    deptTotal += parseFloat(netElement.getAttribute('data-net')) || 0;
                }
            });
            
            subTotals[changedDept] = deptTotal;
            const subtotalElement = document.getElementById(`subtotal_${changedDept}`);
            if(subtotalElement) {
                subtotalElement.innerHTML = `${deptTotal.toLocaleString()} <span class="text-sm font-normal text-gray-500">ج.م</span>`;
            }

            const selectedDept = document.getElementById('filter-dept').value;
            if (selectedDept === 'الكل') {
                let grandTotal = 0;
                for (const key in subTotals) {
                    grandTotal += subTotals[key];
                }
                grandTotalElement.innerHTML = `${grandTotal.toLocaleString()} <span class="text-lg font-normal text-blue-300">ج.م</span>`;
            }
        }

        window.changeDepartment = function(id, newDept) {
            const index = employees.findIndex(e => e.id === id);
            if(index !== -1) {
                employees[index].department = newDept;
                localStorage.setItem('tobim_employees_v5', JSON.stringify(employees));
                renderDepartments(); 
            }
        };

        const empModal = document.getElementById('newEmployeeModal');
        
        window.openEmployeeModal = function() {
            empModal.classList.remove('hidden');
        }
        
        window.closeEmployeeModal = function() {
            empModal.classList.add('hidden');
            document.getElementById('newEmpName').value = '';
            document.getElementById('newEmpRole').value = '';
            document.getElementById('newEmpDept').value = 'الإدارة';
            document.getElementById('newEmpSalary').value = '';
            document.getElementById('newEmpIsManager').checked = false;
        }

        window.saveNewEmployee = function(e) {
            e.preventDefault();
            
            const name = document.getElementById('newEmpName').value;
            const role = document.getElementById('newEmpRole').value;
            const dept = document.getElementById('newEmpDept').value;
            const salary = parseFloat(document.getElementById('newEmpSalary').value) || 0;
            const isManager = document.getElementById('newEmpIsManager').checked;

            let maxId = 0;
            if (employees.length > 0) {
                maxId = Math.max(...employees.map(emp => emp.id));
            }
            const newId = maxId + 1;

            const newEmp = {
                id: newId,
                name: name,
                role: role,
                department: dept,
                baseSalary: salary,
                isManager: isManager
            };

            employees.push(newEmp);
            localStorage.setItem('tobim_employees_v5', JSON.stringify(employees));
            
            closeEmployeeModal();
            document.getElementById('filter-dept').value = 'الكل';
            renderDepartments();
        }

        renderDepartments();
    </script>
</body>
</html>
