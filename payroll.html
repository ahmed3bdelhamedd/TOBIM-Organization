<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBIM — إدارة الرواتب والأقسام</title>
    <link rel="icon" type="image/jpeg" href="TobimLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; }</style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col">

    <!-- حماية صفحة الرواتب للإدارة فقط -->
    <script>
        if (localStorage.getItem('tobim_user_email') !== 'info@ahmedabdelhamed.com') {
            alert("عذراً، هذه الصفحة مخصصة لمدير النظام (الإدارة) فقط.");
            window.location.href = 'subscriptions.html';
        }
    </script>

    <!-- الهيدر الموحد مع بروفايل الحساب -->
    <header class="bg-[#0f172a]/90 backdrop-blur-md border-b border-gray-800 h-20 flex items-center px-6 justify-between sticky top-0 z-50">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3 group cursor-pointer" onclick="location.href='dashboard.html'">
                <img src="TobimLogo.jpg" onerror="this.src='https://via.placeholder.com/40'" class="w-10 h-10 rounded-xl object-cover border border-gray-700 shadow-lg" alt="Logo">
                <span class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">TO BIM</span>
            </div>
            <nav class="hidden md:flex items-center gap-2 text-sm font-semibold">
                <a href="dashboard.html" id="nav-finance" class="text-gray-400 hover:text-white px-4 py-2.5 rounded-xl transition">الماليات</a>
                <a href="subscriptions.html" class="text-gray-400 hover:text-white px-4 py-2.5 rounded-xl transition">سجل الاشتراكات</a>
                <a href="new-sub.html" class="bg-emerald-600/10 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/20 px-4 py-2.5 rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> اشتراك جديد
                </a>
            </nav>
        </div>

        <div class="relative">
            <button onclick="toggleProfileDropdown()" class="flex items-center gap-3 bg-[#111827] hover:bg-gray-800 border border-gray-700 px-4 py-2 rounded-2xl transition">
                <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-md" id="user-avatar-initial">أ</div>
                <div class="text-right hidden sm:block">
                    <p id="header-username" class="text-xs font-bold text-white">أحمد عبد الحميد</p>
                    <p id="header-useremail" class="text-[10px] text-gray-400">info@ahmedabdelhamed.com</p>
                </div>
                <i class="fa-solid fa-chevron-down text-xs text-gray-400 mr-1"></i>
            </button>
            <div id="profile-dropdown" class="hidden absolute left-0 mt-3 w-64 bg-[#111827] border border-gray-700 rounded-2xl shadow-2xl overflow-hidden z-50">
                <div class="p-4 border-b border-gray-800 bg-[#0f172a]">
                    <p class="text-xs text-gray-400">الحساب الحالي</p>
                    <p id="dropdown-email" class="text-xs font-bold text-white truncate mt-1">info@ahmedabdelhamed.com</p>
                </div>
                <div class="p-2 space-y-1">
                    <button onclick="openProfileModal()" class="w-full text-right px-4 py-2 text-sm text-gray-300 hover:bg-gray-800 hover:text-white rounded-xl transition flex items-center gap-2">
                        <i class="fa-solid fa-user-gear text-blue-400"></i> تعديل بيانات الحساب
                    </button>
                    <button onclick="logout()" class="w-full text-right px-4 py-2 text-sm text-red-400 hover:bg-red-500/10 rounded-xl transition flex items-center gap-2">
                        <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8 space-y-6 relative z-10">
        
        <!-- شريط التنقل المتكامل -->
        <div class="flex items-center gap-3 overflow-x-auto pb-4 border-b border-gray-800/50">
            <a href="dashboard.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-6 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition-all"><i class="fa-solid fa-chart-pie ml-2"></i>الداشبورد العام</a>
            <a href="statements.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-6 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition-all"><i class="fa-solid fa-file-invoice-dollar ml-2"></i>كشف الحسابات</a>
            <a href="payroll.html" class="bg-gradient-to-r from-blue-600 to-blue-700 text-white px-6 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap shadow-lg"><i class="fa-solid fa-users ml-2"></i>إدارة الرواتب</a>
            <a href="marketing.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-6 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition-all"><i class="fa-solid fa-bullhorn ml-2"></i>التسويق</a>
            <a href="expenses.html" class="bg-[#111827] hover:bg-gray-800 text-gray-400 hover:text-white border border-gray-800 px-6 py-2.5 rounded-xl text-sm font-bold whitespace-nowrap transition-all"><i class="fa-solid fa-receipt ml-2"></i>المصروفات العامة</a>
        </div>

        <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
            <h2 class="text-2xl font-black text-white">إدارة الرواتب والأقسام</h2>
            <button onclick="openEmployeeModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition shadow-lg flex items-center gap-2">
                <i class="fa-solid fa-user-plus"></i> إضافة موظف جديد
            </button>
        </div>

        <!-- فلاتر الأقسام -->
        <div class="bg-[#111827] p-5 rounded-3xl border border-gray-800 flex flex-wrap items-end gap-4 mb-6 shadow-lg">
            <div>
                <label class="block text-sm text-gray-400 mb-2">القسم</label>
                <select id="filter-dept" onchange="renderDepartments()" class="bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none focus:border-blue-500 w-48">
                    <option value="الكل">جميع الأقسام</option>
                    <option value="الإدارة">الإدارة</option>
                    <option value="المبيعات">المبيعات</option>
                    <option value="تقنية المعلومات">تقنية المعلومات</option>
                    <option value="الجرافيك">الجرافيك</option>
                    <option value="المدربين">المدربين</option>
                    <option value="السوشيال ميديا">السوشيال ميديا</option>
                </select>
            </div>
        </div>

        <!-- حاوية الأقسام -->
        <div id="departments-container" class="space-y-8"></div>

        <!-- الإجمالي العام -->
        <div id="grand-total-container" class="bg-gradient-to-r from-blue-900/40 to-[#111827] p-6 rounded-3xl border border-blue-500/30 shadow-xl flex justify-between items-center mt-8">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-sack-dollar text-blue-400 text-3xl"></i>
                <span class="text-xl font-bold text-blue-200">الإجمالي العام للرواتب المعتمدة</span>
            </div>
            <span id="grand-total-payroll" class="text-4xl font-black text-white">98,000 <span class="text-lg font-normal text-blue-300">ج.م</span></span>
        </div>
    </main>

    <!-- نافذة إضافة موظف -->
    <div id="newEmployeeModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-[#111827] border border-gray-800 p-6 rounded-3xl w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-black text-white mb-6">تسجيل موظف جديد</h3>
            <form onsubmit="saveNewEmployee(event)" class="space-y-4">
                <input type="text" id="newEmpName" required placeholder="اسم الموظف" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5">
                <input type="text" id="newEmpRole" required placeholder="المسمى الوظيفي" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5">
                <select id="newEmpDept" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5">
                    <option value="الإدارة">الإدارة</option>
                    <option value="المبيعات">المبيعات</option>
                    <option value="تقنية المعلومات">تقنية المعلومات</option>
                    <option value="الجرافيك">الجرافيك</option>
                    <option value="المدربين">المدربين</option>
                    <option value="السوشيال ميديا">السوشيال ميديا</option>
                </select>
                <input type="number" id="newEmpSalary" required placeholder="الراتب الأساسي" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5">
                <div class="flex gap-3 mt-6">
                    <button type="submit" class="flex-1 bg-blue-600 text-white px-4 py-2.5 rounded-xl font-bold">حفظ</button>
                    <button type="button" onclick="closeEmployeeModal()" class="flex-1 bg-transparent border border-gray-700 text-white px-4 py-2.5 rounded-xl font-bold">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <!-- نافذة تعديل الحساب -->
    <div id="profileModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-[#111827] border border-gray-800 p-6 rounded-3xl w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-black text-white mb-6">تعديل بيانات الحساب</h3>
            <form onsubmit="saveProfileChanges(event)" class="space-y-4">
                <input type="text" id="profile-name-input" required class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5">
                <input type="email" id="profile-email-input" required class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5">
                <div class="flex gap-3 mt-6">
                    <button type="submit" class="flex-1 bg-blue-600 text-white px-4 py-2 rounded-xl font-bold">حفظ</button>
                    <button type="button" onclick="closeProfileModal()" class="flex-1 bg-transparent border border-gray-700 text-white px-4 py-2 rounded-xl font-bold">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('tobim_user_email') || 'info@ahmedabdelhamed.com';
            const savedName = localStorage.getItem('tobim_user_name') || 'أحمد عبد الحميد';
            document.getElementById('header-useremail').innerText = savedEmail;
            document.getElementById('dropdown-email').innerText = savedEmail;
            document.getElementById('header-username').innerText = savedName;
            document.getElementById('user-avatar-initial').innerText = savedName.charAt(0);
        });

        function toggleProfileDropdown() { document.getElementById('profile-dropdown').classList.toggle('hidden'); }
        function openProfileModal() {
            document.getElementById('profile-dropdown').classList.add('hidden');
            document.getElementById('profile-name-input').value = localStorage.getItem('tobim_user_name') || 'أحمد عبد الحميد';
            document.getElementById('profile-email-input').value = localStorage.getItem('tobim_user_email') || 'info@ahmedabdelhamed.com';
            document.getElementById('profileModal').classList.remove('hidden');
        }
        function closeProfileModal() { document.getElementById('profileModal').classList.add('hidden'); }
        function saveProfileChanges(e) {
            e.preventDefault();
            localStorage.setItem('tobim_user_name', document.getElementById('profile-name-input').value);
            localStorage.setItem('tobim_user_email', document.getElementById('profile-email-input').value);
            alert("تم التحديث بنجاح!");
            location.reload();
        }
        function logout() { localStorage.removeItem('tobim_user_email'); location.href = 'login.html'; }

        // الرواتب والأقسام
        const departmentsList = ['الإدارة', 'المبيعات', 'تقنية المعلومات', 'الجرافيك', 'المدربين', 'السوشيال ميديا'];
        const defaultEmployees = [
            { id: 1, name: "صلاح البدوي", role: "المدير", department: "الإدارة", baseSalary: 40000, isManager: true },
            { id: 2, name: "هشام غيب", role: "محاسب مالي", department: "الإدارة", baseSalary: 8000, isManager: false },
            { id: 7, name: "صلاح الدين", role: "عامل نظافة", department: "الإدارة", baseSalary: 4500, isManager: false },
            { id: 5, name: "صباح شعبان", role: "موظف مبيعات", department: "المبيعات", baseSalary: 6500, isManager: false },
            { id: 6, name: "محسن إسلام", role: "موظف مبيعات", department: "المبيعات", baseSalary: 10000, isManager: false },
            { id: 4, name: "عمر عبد العزيز", role: "موظف مبيعات", department: "المبيعات", baseSalary: 6500, isManager: false },
            { id: 3, name: "أحمد عبد الحميد", role: "موظف IT", department: "تقنية المعلومات", baseSalary: 6500, isManager: false },
            { id: 8, name: "عامر علي", role: "مصمم جرافيك", department: "الجرافيك", baseSalary: 16000, isManager: false },
            { id: 9, name: "حسناء يسري", role: "مدرب معماري", department: "المدربين", baseSalary: 5500, isManager: false },
            { id: 10, name: "مصطفى حنفي", role: "مدرب إنشائي", department: "المدربين", baseSalary: 7000, isManager: false },
            { id: 11, name: "سحر الوزير", role: "أخصائي سوشيال ميديا", department: "السوشيال ميديا", baseSalary: 7000, isManager: false }
        ];

        let employees = JSON.parse(localStorage.getItem('tobim_employees_v6')) || defaultEmployees;

        function renderDepartments() {
            const container = document.getElementById('departments-container');
            container.innerHTML = '';
            const selectedDept = document.getElementById('filter-dept').value;
            let deptsToRender = selectedDept === 'الكل' ? departmentsList : [selectedDept];
            
            let grandTotal = 0;

            deptsToRender.forEach(dept => {
                const list = employees.filter(e => e.department === dept);
                if(list.length > 0) {
                    let rows = '';
                    let subTotal = 0;
                    list.forEach(emp => {
                        subTotal += emp.baseSalary;
                        rows += `
                            <tr class="hover:bg-gray-800/30 transition">
                                <td class="p-4 font-bold text-white">${emp.name} ${emp.isManager ? '<span class="bg-amber-500/20 text-amber-400 text-xs px-2 py-0.5 rounded">المدير</span>' : ''}</td>
                                <td class="p-4 text-sm text-blue-400">${emp.role}</td>
                                <td class="p-4 font-bold text-gray-300">${emp.baseSalary.toLocaleString()} ج.م</td>
                            </tr>`;
                    });
                    grandTotal += subTotal;

                    container.innerHTML += `
                        <div class="bg-[#111827]/80 rounded-3xl border border-gray-800 overflow-hidden shadow-xl mb-6">
                            <div class="bg-[#0f172a] p-4 border-b border-gray-800 font-bold text-white">قسم ${dept}</div>
                            <table class="w-full text-right">
                                <thead class="bg-[#0f172a]/50 text-gray-400 text-xs">
                                    <tr><th class="p-4">الموظف</th><th class="p-4">الوظيفة</th><th class="p-4">الراتب الأساسي</th></tr>
                                </thead>
                                <tbody class="divide-y divide-gray-800/50">${rows}</tbody>
                            </table>
                            <div class="bg-[#0f172a] p-4 border-t border-gray-800 flex justify-between font-bold">
                                <span>إجمالي قسم ${dept}:</span>
                                <span class="text-white">${subTotal.toLocaleString()} ج.م</span>
                            </div>
                        </div>`;
                }
            });
            document.getElementById('grand-total-payroll').innerHTML = `${grandTotal.toLocaleString()} <span class="text-lg text-blue-300">ج.م</span>`;
        }

        renderDepartments();

        function openEmployeeModal() { document.getElementById('newEmployeeModal').classList.remove('hidden'); }
        function closeEmployeeModal() { document.getElementById('newEmployeeModal').classList.add('hidden'); }
        function saveNewEmployee(e) {
            e.preventDefault();
            let name = document.getElementById('newEmpName').value;
            let role = document.getElementById('newEmpRole').value;
            let department = document.getElementById('newEmpDept').value;
            let baseSalary = parseFloat(document.getElementById('newEmpSalary').value) || 0;

            employees.push({ id: Date.now(), name, role, department, baseSalary, isManager: false });
            localStorage.setItem('tobim_employees_v6', JSON.stringify(employees));
            renderDepartments();
            closeEmployeeModal();
        }
    </script>
</body>
</html>
