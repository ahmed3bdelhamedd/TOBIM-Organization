<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBIM — قائمة الأسعار الرسمية</title>
    <link rel="icon" type="image/jpeg" href="TobimLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-900/20 via-[#0b0f19] to-[#0b0f19]">

    <!-- الهيدر الموحد المتضمن لصفحة طلبات IT -->
    <header class="bg-[#0f172a]/90 backdrop-blur-md border-b border-gray-800 h-20 flex items-center px-6 justify-between sticky top-0 z-50">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3 group cursor-pointer" onclick="location.href='subscriptions.html'">
                <img src="TobimLogo.jpg" onerror="this.src='https://via.placeholder.com/40'" class="w-10 h-10 rounded-xl object-cover border border-gray-700 shadow-lg" alt="Logo">
                <span class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">TO BIM</span>
            </div>
            <nav class="hidden md:flex items-center gap-2 text-sm font-semibold">
                <a href="dashboard.html" id="nav-finance" class="text-gray-400 hover:text-white px-4 py-2.5 rounded-xl transition">الماليات</a>
                <a href="subscriptions.html" class="text-gray-400 hover:text-white px-4 py-2.5 rounded-xl transition">سجل الاشتراكات</a>
                <a href="pricing.html" class="bg-gradient-to-r from-blue-600 to-blue-500 text-white px-4 py-2.5 rounded-xl shadow-[0_0_15px_rgba(59,130,246,0.3)] transition">قائمة الأسعار</a>
                <a href="it-requests.html" class="text-gray-400 hover:text-white px-4 py-2.5 rounded-xl transition">طلبات IT</a>
                <a href="new-sub.html" class="bg-emerald-600/10 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/20 px-4 py-2.5 rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> اشتراك جديد
                </a>
            </nav>
        </div>

        <div class="relative">
            <button onclick="toggleProfileDropdown()" class="flex items-center gap-3 bg-[#111827] hover:bg-gray-800 border border-gray-700 px-4 py-2 rounded-2xl transition">
                <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-md" id="user-avatar-initial">أ</div>
                <div class="text-right hidden sm:block">
                    <p id="header-username" class="text-xs font-bold text-white">أحمد عبد الحميد</p>
                    <p id="header-useremail" class="text-[10px] text-gray-400">info@ahmedabdelhamed.com</p>
                </div>
                <i class="fa-solid fa-chevron-down text-xs text-gray-400 mr-1"></i>
            </button>
            <div id="profile-dropdown" class="hidden absolute left-0 mt-3 w-64 bg-[#111827] border border-gray-700 rounded-2xl shadow-2xl overflow-hidden z-50">
                <div class="p-4 border-b border-gray-800 bg-[#0f172a]">
                    <p class="text-xs text-gray-400">الحساب الحالي</p>
                    <p id="dropdown-email" class="text-xs font-bold text-white truncate mt-1">info@ahmedabdelhamed.com</p>
                </div>
                <div class="p-2 space-y-1">
                    <button onclick="openProfileModal()" class="w-full text-right px-4 py-2 text-sm text-gray-300 hover:bg-gray-800 hover:text-white rounded-xl transition flex items-center gap-2">
                        <i class="fa-solid fa-user-gear text-blue-400"></i> تعديل بيانات الحساب
                    </button>
                    <button onclick="logout()" class="w-full text-right px-4 py-2 text-sm text-red-400 hover:bg-red-500/10 rounded-xl transition flex items-center gap-2">
                        <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8 space-y-6 relative z-10">
        <div class="flex justify-between items-center mb-2 flex-wrap gap-4">
            <div>
                <h2 class="text-2xl font-black text-white">قائمة الأسعار الرسمية والخصومات</h2>
                <p class="text-sm text-gray-400 mt-1">استعراض الأسعار الأصلية، قيمة الخصم، والأسعار النهائية بعد الخصم</p>
            </div>
            <!-- زر الإضافة يظهر للمدير فقط -->
            <button id="add-price-btn" onclick="openPriceModal()" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl text-sm font-bold transition shadow-lg flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> إضافة خدمة / سعر جديد
            </button>
        </div>

        <!-- فلاتر البحث -->
        <div class="bg-[#111827] p-5 rounded-3xl border border-gray-800 flex flex-wrap items-end gap-4 shadow-lg">
            <div>
                <label class="block text-sm text-gray-400 mb-2"><i class="fa-solid fa-magnifying-glass text-blue-500 ml-1"></i> بحث عن كورس أو دبلومة</label>
                <input type="text" id="search-price" oninput="renderPrices()" placeholder="اكتب للبحث..." class="bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2 focus:outline-none focus:border-blue-500 w-64">
            </div>
        </div>

        <!-- شبكة المربعات (Grid Cards) للأسعار والخصومات -->
        <div id="prices-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- توليد المربعات برمجياً -->
        </div>
    </main>

    <!-- نافذة إضافة سعر جديد (للأدمن فقط) -->
    <div id="priceModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-[#111827] border border-gray-800 p-6 rounded-3xl w-full max-w-md shadow-2xl space-y-4">
            <h3 class="text-xl font-black text-white mb-4"><i class="fa-solid fa-tag text-blue-500 ml-2"></i> إضافة سعر جديد للكتالوج</h3>
            <form onsubmit="saveNewPrice(event)" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">اسم الخدمة / الكورس *</label>
                    <input type="text" id="newPriceName" required placeholder="مثال: Revit Advanced" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">السعر الأصلي (ج.م) *</label>
                    <input type="number" id="newPriceVal" required placeholder="5000" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">قيمة الخصم (ج.م) [اختياري]</label>
                    <input type="number" id="newPriceDiscount" placeholder="0" value="0" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500">
                </div>
                <div class="flex gap-3 mt-6">
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl font-bold transition">حفظ</button>
                    <button type="button" onclick="closePriceModal()" class="flex-1 bg-transparent hover:bg-gray-800 border border-gray-700 text-white px-4 py-2.5 rounded-xl font-bold transition">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <!-- نافذة تعديل السعر (للأدمن فقط) -->
    <div id="editPriceModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-[#111827] border border-gray-800 p-6 rounded-3xl w-full max-w-md shadow-2xl space-y-4">
            <h3 class="text-xl font-black text-white mb-4"><i class="fa-solid fa-pen-to-square text-emerald-500 ml-2"></i> تعديل سعر الكورس والخصم</h3>
            <form onsubmit="updatePrice(event)" class="space-y-4">
                <input type="hidden" id="editPriceId">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">اسم الخدمة / الكورس *</label>
                    <input type="text" id="editPriceName" required class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">السعر الأصلي (ج.م) *</label>
                    <input type="number" id="editPriceVal" required class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">قيمة الخصم (ج.م)</label>
                    <input type="number" id="editPriceDiscount" placeholder="0" class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500">
                </div>
                <div class="flex gap-3 mt-6">
                    <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl font-bold transition">تحديث</button>
                    <button type="button" onclick="closeEditPriceModal()" class="flex-1 bg-transparent hover:bg-gray-800 border border-gray-700 text-white px-4 py-2.5 rounded-xl font-bold transition">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <!-- نافذة تعديل الحساب -->
    <div id="profileModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="bg-[#111827] border border-gray-800 p-6 rounded-3xl w-full max-w-md shadow-2xl">
            <h3 class="text-xl font-black text-white mb-6">تعديل بيانات الحساب</h3>
            <form onsubmit="saveProfileChanges(event)" class="space-y-4">
                <input type="text" id="profile-name-input" required class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5">
                <input type="email" id="profile-email-input" required class="w-full bg-[#0b0f19] border border-gray-700 text-white rounded-xl px-4 py-2.5">
                <div class="flex gap-3 mt-6">
                    <button type="submit" class="flex-1 bg-blue-600 text-white px-4 py-2 rounded-xl font-bold">حفظ</button>
                    <button type="button" onclick="closeProfileModal()" class="flex-1 bg-transparent border border-gray-700 text-white px-4 py-2 rounded-xl font-bold">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const currentUserEmail = localStorage.getItem('tobim_user_email') || 'info@ahmedabdelhamed.com';
        const isAdmin = (currentUserEmail === 'info@ahmedabdelhamed.com');

        document.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('tobim_user_name') || 'أحمد عبد الحميد';
            document.getElementById('header-useremail').innerText = currentUserEmail;
            document.getElementById('dropdown-email').innerText = currentUserEmail;
            document.getElementById('header-username').innerText = savedName;
            document.getElementById('user-avatar-initial').innerText = savedName.charAt(0);

            if (!isAdmin) {
                const financeNav = document.getElementById('nav-finance');
                if (financeNav) financeNav.style.display = 'none';
            } else {
                document.getElementById('add-price-btn').classList.remove('hidden');
            }

            initPrices();
            renderPrices();
        });

        function toggleProfileDropdown() { document.getElementById('profile-dropdown').classList.toggle('hidden'); }
        function openProfileModal() {
            document.getElementById('profile-dropdown').classList.add('hidden');
            document.getElementById('profile-name-input').value = localStorage.getItem('tobim_user_name') || 'أحمد عبد الحميد';
            document.getElementById('profile-email-input').value = currentUserEmail;
            document.getElementById('profileModal').classList.remove('hidden');
        }
        function closeProfileModal() { document.getElementById('profileModal').classList.add('hidden'); }
        function saveProfileChanges(e) {
            e.preventDefault();
            localStorage.setItem('tobim_user_name', document.getElementById('profile-name-input').value);
            localStorage.setItem('tobim_user_email', document.getElementById('profile-email-input').value);
            alert("تم التحديث بنجاح!");
            location.reload();
        }
        function logout() { localStorage.removeItem('tobim_user_email'); location.href = 'login.html'; }

        let pricesCatalog = JSON.parse(localStorage.getItem('tobim_prices_catalog_v2')) || [
            { id: 1, name: "دبلومة الإنشائي", price: 9800, discount: 0 },
            { id: 2, name: "دبلومة المعماري", price: 8900, discount: 0 },
            { id: 3, name: "Revit Architecture", price: 5000, discount: 0 },
            { id: 4, name: "Revit Structural", price: 4000, discount: 0 },
            { id: 5, name: "Shopdrawing Reinforcement", price: 5000, discount: 500 },
            { id: 6, name: "Structural BIM Technical Office", price: 15000, discount: 1000 },
            { id: 7, name: "BIM Architecture Diploma", price: 15000, discount: 2000 },
            { id: 8, name: "CSI", price: 4000, discount: 0 },
            { id: 9, name: "CSI/REVIT ST package", price: 8000, discount: 1000 },
            { id: 10, name: "Enscape", price: 2500, discount: 0 },
            { id: 11, name: "Navisworks 4D & 5D", price: 5000, discount: 0 },
            { id: 12, name: "Navisworks Coordinator", price: 5000, discount: 0 },
            { id: 13, name: "Revit Family", price: 5000, discount: 0 },
            { id: 14, name: "Revit MEP", price: 3000, discount: 0 },
            { id: 15, name: "Revit Schedule", price: 3000, discount: 0 },
            { id: 16, name: "Revit Template", price: 3000, discount: 0 },
            { id: 17, name: "Revit worksharing", price: 3000, discount: 0 },
            { id: 18, name: "Shopdrawing Concrete", price: 5000, discount: 0 },
            { id: 19, name: "Twinmotion", price: 3000, discount: 0 },
            { id: 20, name: "Facebook ADS GUID", price: 1000, discount: 0 },
            { id: 21, name: "POWER BI", price: 3000, discount: 0 },
            { id: 22, name: "Photoshop", price: 3000, discount: 0 },
            { id: 23, name: "3DsMAX", price: 5000, discount: 0 },
            { id: 24, name: "3DsMAX Masterclass", price: 12000, discount: 1500 },
            { id: 25, name: "Advanced Rendering Vray", price: 6000, discount: 0 },
            { id: 26, name: "Advanced Modeling", price: 5000, discount: 0 },
            { id: 27, name: "AutoCad Workshop", price: 2000, discount: 0 },
            { id: 28, name: "AutoCad Full Course", price: 3000, discount: 0 },
            { id: 29, name: "Excel Engineering", price: 3000, discount: 0 },
            { id: 30, name: "Visualization package", price: 10000, discount: 1000 },
            { id: 31, name: "Advanced Corona", price: 3000, discount: 0 },
            { id: 32, name: "Fourest Back", price: 2000, discount: 0 },
            { id: 33, name: "how to persent your work", price: 2000, discount: 0 },
            { id: 34, name: "BIM Interior Design", price: 30000, discount: 5000 },
            { id: 35, name: "linkedin", price: 2000, discount: 0 },
            { id: 36, name: "Marketing Package", price: 8000, discount: 1000 },
            { id: 37, name: "presentation Package", price: 8000, discount: 1000 },
            { id: 38, name: "Reail Clone", price: 2000, discount: 0 },
            { id: 39, name: "The Perfect Starting", price: 1500, discount: 0 },
            { id: 40, name: "Long Story Short", price: 6000, discount: 0 },
            { id: 41, name: "ACC", price: 6000, discount: 0 },
            { id: 42, name: "Shopdrawing Architecture", price: 6000, discount: 0 },
            { id: 43, name: "TANK WORKSHOP", price: 6000, discount: 0 },
            { id: 44, name: "PRIMAVERA", price: 6000, discount: 0 },
            { id: 45, name: "BUILD CITY", price: 8000, discount: 0 },
            { id: 46, name: "برنامج أوتوديسك", price: 600, discount: 0 }
        ];

        function initPrices() {
            if (!localStorage.getItem('tobim_prices_catalog_v2')) {
                localStorage.setItem('tobim_prices_catalog_v2', JSON.stringify(pricesCatalog));
            } else {
                pricesCatalog = JSON.parse(localStorage.getItem('tobim_prices_catalog_v2'));
            }
        }

        function renderPrices() {
            const grid = document.getElementById('prices-grid');
            grid.innerHTML = '';
            const search = document.getElementById('search-price').value.toLowerCase();

            let filtered = pricesCatalog.filter(item => item.name.toLowerCase().includes(search));

            filtered.forEach(item => {
                let discountVal = item.discount || 0;
                let finalPrice = item.price - discountVal;
                if (finalPrice < 0) finalPrice = 0;

                let priceDisplay = '';
                if (discountVal > 0) {
                    priceDisplay = `
                        <div class="flex items-baseline gap-3">
                            <span class="text-xl font-bold text-gray-500 line-through">${item.price.toLocaleString()} ج.م</span>
                            <span class="text-2xl font-black text-emerald-400">${finalPrice.toLocaleString()} <span class="text-xs">ج.م</span></span>
                        </div>
                        <span class="text-[11px] text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-md border border-amber-500/20 w-fit">خصم: ${discountVal.toLocaleString()} ج.م</span>
                    `;
                } else {
                    priceDisplay = `
                        <div class="flex items-baseline gap-2">
                            <span class="text-2xl font-black text-emerald-400">${item.price.toLocaleString()}</span>
                            <span class="text-xs text-gray-400">ج.م</span>
                        </div>
                        <span class="text-[11px] text-gray-500">بدون خصم</span>
                    `;
                }

                let adminActions = isAdmin ? `
                    <div class="flex gap-2 pt-3 border-t border-gray-800">
                        <button onclick="openEditPriceModal(${item.id})" class="flex-1 bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 py-2 rounded-xl text-xs font-bold hover:bg-emerald-600/30 transition">
                            <i class="fa-solid fa-pen ml-1"></i> تعديل
                        </button>
                        <button onclick="deletePrice(${item.id})" class="flex-1 bg-rose-500/20 text-rose-400 border border-rose-500/30 py-2 rounded-xl text-xs font-bold hover:bg-rose-500/30 transition">
                            <i class="fa-solid fa-trash ml-1"></i> حذف
                        </button>
                    </div>
                ` : '';

                grid.innerHTML += `
                    <div class="bg-[#111827]/80 backdrop-blur-xl border border-gray-800 p-6 rounded-3xl shadow-xl flex flex-col justify-between space-y-4 hover:border-gray-700 transition">
                        <div>
                            <span class="text-xs font-bold text-blue-400 bg-blue-500/10 px-3 py-1 rounded-full border border-blue-500/20">معتمد رسمي</span>
                            <h3 class="text-lg font-black text-white mt-3">${item.name}</h3>
                        </div>
                        <div class="flex flex-col space-y-1">
                            ${priceDisplay}
                        </div>
                        ${adminActions}
                    </div>
                `;
            });
        }

        function openPriceModal() { if(isAdmin) document.getElementById('priceModal').classList.remove('hidden'); }
        function closePriceModal() { document.getElementById('priceModal').classList.add('hidden'); }

        function saveNewPrice(e) {
            e.preventDefault();
            if(!isAdmin) return;

            let name = document.getElementById('newPriceName').value;
            let price = parseFloat(document.getElementById('newPriceVal').value) || 0;
            let discount = parseFloat(document.getElementById('newPriceDiscount').value) || 0;

            pricesCatalog.push({ id: Date.now(), name, price, discount });
            localStorage.setItem('tobim_prices_catalog_v2', JSON.stringify(pricesCatalog));
            renderPrices();
            closePriceModal();
            document.getElementById('newPriceName').value = '';
            document.getElementById('newPriceVal').value = '';
            document.getElementById('newPriceDiscount').value = '0';
        }

        function openEditPriceModal(id) {
            if(!isAdmin) return;
            const item = pricesCatalog.find(p => p.id === id);
            if(!item) return;

            document.getElementById('editPriceId').value = item.id;
            document.getElementById('editPriceName').value = item.name;
            document.getElementById('editPriceVal').value = item.price;
            document.getElementById('editPriceDiscount').value = item.discount || 0;
            document.getElementById('editPriceModal').classList.remove('hidden');
        }

        function closeEditPriceModal() { document.getElementById('editPriceModal').classList.add('hidden'); }

        function updatePrice(e) {
            e.preventDefault();
            if(!isAdmin) return;

            let id = parseInt(document.getElementById('editPriceId').value);
            let name = document.getElementById('editPriceName').value;
            let price = parseFloat(document.getElementById('editPriceVal').value) || 0;
            let discount = parseFloat(document.getElementById('editPriceDiscount').value) || 0;

            let index = pricesCatalog.findIndex(p => p.id === id);
            if(index !== -1) {
                pricesCatalog[index].name = name;
                pricesCatalog[index].price = price;
                pricesCatalog[index].discount = discount;
                localStorage.setItem('tobim_prices_catalog_v2', JSON.stringify(pricesCatalog));
                renderPrices();
                closeEditPriceModal();
            }
        }

        function deletePrice(id) {
            if(!isAdmin) return;
            if(confirm("هل أنت متأكد من حذف هذا السعر من الكتالوج؟")) {
                pricesCatalog = pricesCatalog.filter(p => p.id !== id);
                localStorage.setItem('tobim_prices_catalog_v2', JSON.stringify(pricesCatalog));
                renderPrices();
            }
        }
    </script>
</body>
</html>
