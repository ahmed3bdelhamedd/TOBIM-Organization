<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBIM — ريسيت المشترك</title>
    <link rel="icon" type="image/jpeg" href="TobimLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen p-8 flex flex-col items-center justify-center">
    <script>if(!localStorage.getItem('tobim_logged')) window.location.href = 'login.html';</script>

    <div class="max-w-3xl w-full bg-[#111827] p-8 rounded-3xl border border-gray-800 shadow-2xl space-y-6">
        <div class="flex items-center justify-between border-b border-gray-800 pb-4">
            <h1 class="text-xl font-black text-white" id="title">ريسيت المشترك</h1>
            <a href="subscriptions.html" class="bg-gray-800 text-gray-300 px-4 py-2 rounded-xl text-xs font-bold">العودة</a>
        </div>

        <div class="grid grid-cols-3 gap-4 text-center">
            <div class="bg-[#131b2e] p-4 rounded-2xl">
                <span class="text-xs text-gray-400 block">سعر البيع</span>
                <span class="text-lg font-black text-white" id="tPrice">0 EGP</span>
            </div>
            <div class="bg-[#131b2e] p-4 rounded-2xl">
                <span class="text-xs text-gray-400 block">المدفوع</span>
                <span class="text-lg font-black text-emerald-400" id="pPaid">0 EGP</span>
            </div>
            <div class="bg-[#131b2e] p-4 rounded-2xl">
                <span class="text-xs text-gray-400 block">المتبقي</span>
                <span class="text-lg font-black text-amber-400" id="rRem">0 EGP</span>
            </div>
        </div>

        <div class="bg-[#131b2e]/50 p-5 rounded-2xl grid grid-cols-3 gap-4 text-sm">
            <div><span class="text-xs text-gray-400 block">الموبايل</span><span id="mobile">-</span></div>
            <div><span class="text-xs text-gray-400 block">القسم والراوند</span><span id="dept">-</span></div>
            <div><span class="text-xs text-gray-400 block">مصدر الدفع</span><span id="source">-</span></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const subId = urlParams.get('id');
        let subs = JSON.parse(localStorage.getItem('tobim_subs') || '[]');
        let sub = subs.find(s => s.id == subId) || subs[0];

        if(sub) {
            document.getElementById('title').innerText = `ريسيت ${sub.fullName} — ${sub.id}`;
            document.getElementById('tPrice').innerText = sub.totalPrice + ' EGP';
            document.getElementById('pPaid').innerText = sub.paidAmount + ' EGP';
            document.getElementById('rRem').innerText = sub.remainingAmount + ' EGP';
            document.getElementById('mobile').innerText = sub.mobile;
            document.getElementById('dept').innerText = `${sub.department} / ${sub.round}`;
            document.getElementById('source').innerText = sub.paySource;
        }
    </script>
</body>
</html>
