<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOBIM — تسجيل اشتراك جديد</title>
    <link rel="icon" type="image/jpeg" href="TobimLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; }</style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col">

    <!-- الهيدر المشترك -->
    <header class="bg-[#0f172a]/90 backdrop-blur-md border-b border-gray-800 h-20 flex items-center px-6 justify-between sticky top-0 z-50">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3 group cursor-pointer" onclick="location.href='subscriptions.html'">
                <img src="TobimLogo.jpg" onerror="this.src='https://via.placeholder.com/40'" class="w-10 h-10 rounded-xl object-cover border border-gray-700 shadow-lg" alt="Logo">
                <span class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400">TO BIM</span>
            </div>
            <nav class="hidden md:flex items-center gap-2 text-sm font-semibold">
                <a href="dashboard.html" id="nav-finance" class="text-gray-400 hover:text-white px-4 py-2.5 rounded-xl transition">الماليات</a>
                <a href="subscriptions.html" class="text-gray-400 hover:text-white px-4 py-2.5 rounded-xl transition">سجل الاشتراكات</a>
                <a href="new-sub.html" class="bg-gradient-to-r from-blue-600 to-blue-500 text-white px-4 py-2.5 rounded-xl shadow-[0_0_15px_rgba(59,130,246,0.3)] transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> اشتراك جديد
                </a>
            </nav>
        </div>
        <!-- بروفايل المستخدم -->
        <div class="relative">
            <button onclick="toggleProfileDropdown()" class="flex items-center gap-3 bg-[#111827] hover:bg-gray-800 border border-gray-700 px-4 py-2 rounded-2xl transition">
                <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-md" id="user-avatar-initial">أ</div>
                <div class="text-right hidden sm:block">
                    <p id="header-username" class="text-xs font-bold text-white">أحمد عبد الحميد</p>
                    <p id="header-useremail" class="text-[10px] text-gray-400">info@ahmedabdelhamed.com</p>
                </div>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-8 space-y-6 relative z-10">
        <h2 class="text-2xl font-black text-white mb-4">تسجيل اشتراك جديد</h2>
        <form id="newSubForm" onsubmit="saveSubscription(event)" class="space-y-6">
            <div class="bg-[#111827]/80 backdrop-blur-xl p-6 rounded-3xl border border-gray-800 space-y-4">
                <h3 class="text-lg font-bold text-white">بيانات المشترك</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="sub-name" required placeholder="الاسم ثلاثي" class="bg-[#0b0f19] border border-gray-700 p-3 rounded-xl text-white">
                    <input type="tel" id="sub-mobile" required placeholder="رقم الموبايل" class="bg-[#0b0f19] border border-gray-700 p-3 rounded-xl text-white">
                    <input type="email" id="sub-email" required placeholder="البريد الإلكتروني" class="bg-[#0b0f19] border border-gray-700 p-3 rounded-xl text-white">
                    <select id="sub-sales" required class="bg-[#0b0f19] border border-gray-700 p-3 rounded-xl text-white">
                        <option value="" disabled selected>مسؤول المبيعات</option>
                        <option value="عمر">عمر</option>
                        <option value="محسن">محسن</option>
                        <option value="صباح">صباح</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="bg-blue-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg">حفظ الاشتراك</button>
        </form>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedEmail = localStorage.getItem('tobim_user_email') || 'info@ahmedabdelhamed.com';
            if (savedEmail !== 'info@ahmedabdelhamed.com') {
                const financeNav = document.getElementById('nav-finance');
                if (financeNav) financeNav.style.display = 'none';
            }
        });
        function saveSubscription(e) {
            e.preventDefault();
            alert("تم حفظ الاشتراك بنجاح!");
            window.location.href = 'subscriptions.html';
        }
    </script>
</body>
</html>
