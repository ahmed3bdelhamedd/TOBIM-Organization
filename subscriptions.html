<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO BIM — اشتراكاتي</title>
    <link rel="icon" type="image/jpeg" href="TobimLogo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-[#0b0f19] text-gray-100 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-[#0f172a] border-b border-gray-800 h-20 flex items-center px-6 justify-between sticky top-0 z-40">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <img src="TobimLogo.jpg" class="w-10 h-10 rounded-xl object-cover border border-gray-700" alt="Logo">
                <span class="text-xl font-black text-white">TO BIM</span>
            </div>
            <nav class="hidden md:flex items-center gap-2 text-sm font-semibold">
                <a href="new-sub.html" class="text-gray-400 hover:text-white px-4 py-2 rounded-xl transition">اشتراك جديد</a>
                <a href="subscriptions.html" class="bg-blue-600 text-white px-4 py-2 rounded-xl transition">اشتراكاتي</a>
                <a href="#" class="text-gray-400 hover:text-white px-4 py-2 rounded-xl transition">كل المشتركين</a>
                <a href="#" class="text-gray-400 hover:text-white px-4 py-2 rounded-xl transition">المستحق</a>
                <a href="#" class="text-gray-400 hover:text-white px-4 py-2 rounded-xl transition">طلباتي</a>
            </nav>
        </div>
        <a href="index.html" class="bg-red-500/10 text-red-400 border border-red-500/30 px-4 py-2 rounded-xl text-sm font-bold">خروج</a>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">
        <div class="bg-[#111827] p-6 rounded-3xl border border-gray-800 shadow-xl">
            <h2 class="text-lg font-black text-white mb-6">سجل الاشتراكات (اضغط على أي مشترك لعرض الريسيت)</h2>
            
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead class="bg-[#131b2e] text-gray-400 text-xs uppercase border-b border-gray-800">
                        <tr>
                            <th class="p-4">#</th>
                            <th class="p-4">الاسم</th>
                            <th class="p-4">الموبايل</th>
                            <th class="p-4">القسم / الراوند</th>
                            <th class="p-4">سعر البيع</th>
                            <th class="p-4">المدفوع</th>
                            <th class="p-4">المتبقي</th>
                            <th class="p-4">الحالة</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-800">
                        <tr onclick="location.href='receipt.html'" class="hover:bg-blue-600/10 cursor-pointer transition">
                            <td class="p-4 font-bold text-gray-400">201135</td>
                            <td class="p-4 font-bold text-white underline decoration-blue-500">SHADY MOSTAFA ABDELATEF ELSAYED</td>
                            <td class="p-4 text-gray-300 font-mono">0111111111</td>
                            <td class="p-4 text-blue-400">إنشائي / Round 27</td>
                            <td class="p-4 font-mono">12,000 EGP</td>
                            <td class="p-4 font-mono text-emerald-400">9,500 EGP</td>
                            <td class="p-4 font-mono text-amber-400">2,500 EGP</td>
                            <td class="p-4"><span class="bg-amber-500/20 text-amber-400 px-3 py-1 rounded-full text-xs font-bold border border-amber-500/30">Rest</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
